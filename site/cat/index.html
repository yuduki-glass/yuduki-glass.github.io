<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191918">
  <title>CAT WATCHING LOG | 結月硝子</title>
  <link rel="stylesheet" href="./observation.css">
  <meta name="cat-position-feed" content="https://script.google.com/macros/s/AKfycbxGip-XUzmUfFuCa7mHhbB24jcF5RN_dgdF0LIK6SOWJoWm6BRyMT6eC4yFz7UdMceW/exec">
  <script type="module" src="./observation.js"></script>
</head>
<body>
  <main>
    <header class="masthead">
      <a href="/">結月硝子</a>
      <span>猫指数観測所</span>
    </header>
    <section aria-labelledby="title">
      <div class="heading">
        <div>
          <h1 id="title">Cat Watching Log</h1>
          <p class="subtitle">住宅街の路地</p>
        </div>
        <div class="clock" aria-label="日本標準時">
          <time id="clock">--:--</time>
          <span id="period">JST</span>
        </div>
      </div>
      <figure>
        <div class="view">
          <canvas id="scene" width="1280" height="720" role="img" aria-label="現在の時刻と天候に合わせた住宅街のピクセルアート">住宅街の路地。手前の塀から、車のある駐車場を通って路地が遠くへ続いています。</canvas>
          <p id="status" role="status">風景を読み込み中</p>
        </div>
        <figcaption>
          <span id="conditions">葛飾の天候を取得中</span>
          <a href="https://open-meteo.com/">気象データ © Open-Meteo</a>
        </figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
