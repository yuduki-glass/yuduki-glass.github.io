</style><main><header><a href="/">結月硝子</a><small>観測窓 / 試作</small></header><h1>CAT WATCHING LOG</h1><small>町の片隅。猫たちのいる風景。</small><figure><canvas id="scene" width="1000" height="600" aria-label="住宅街の猫の試作アニメーション"></canvas><figcaption><span id="clock"></span><span>仮想行動データによる試作映像</span></figcaption></figure><button id="rain">雨の演出を切り替え</button> <button id="night">昼夜の演出を切り替え</button><p>操作するためではなく、眺めるための場所。</p><footer>現在は描画検証用です。実際の猫庭の行動記録・天候・LINE配信には接続していません。</footer></main><script>
const c=document.getElementById('scene'),x=c.getContext('2d');let rain=false,night=null;document.getElementById('rain').onclick=()=>rain=!rain;document.getElementById('night').onclick=()=>night=night===null?true:!night;
function rect(a,b,w,h,color){x.fillStyle=color;x.fillRect(a,b,w,h)}function ellipse(a,b,w,h,color){x.fillStyle=color;x.beginPath();x.ellipse(a,b,w,h,0,0,Math.PI*2);x.fill()}function poly(p,color){x.fillStyle=color;x.beginPath();p.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.closePath();x.fill()}function line(a,b,d,e,color,w){x.strokeStyle=color;x.lineWidth=w;x.beginPath();x.moveTo(a,b);x.lineTo(d,e);x.stroke()}
function house(a,b,w,h,color){rect(a,b,w,h,color);poly([[a-15,b],[a+w*.43,b-65],[a+w+15,b]],'#555e60');for(let i=0;i<3;i++){rect(a+20+i*w/3,b+32,w/5,49,'#526b73');rect(a+24+i*w/3,b+36,w/5-8,41,N?'#e2b77a':'#a8c5c5');line(a+20+i*w/3+w/10,b+32,a+20+i*w/3+w/10,b+81,'#62716c',3)}}
let N=false;function cat(a,b,k,walk,dir,phase){x.save();x.translate(a,b);let s=.65+b/650;x.scale(s*dir,s);ellipse(0,5,24,5,'#41453c44');x.lineCap='round';let colors=['#dfb584','#303638','#c68b51'],v=colors[k];x.strokeStyle=v;x.lineWidth=5;x.beginPath();x.moveTo(-15,-11);x.quadraticCurveTo(-32,-17,-27,-30+Math.sin(phase)*3);x.stroke();ellipse(0,-12,19,walk?9:12,v);ellipse(16,-20,10,9,v);poly([[9,-25],[10,-35],[17,-27]],v);poly([[17,-28],[23,-34],[24,-24]],v);if(k===0){ellipse(-8,-15,8,7,'#5e554c');ellipse(7,-12,6,6,'#f3e7d1')}if(k===2)for(let i=-10;i<10;i+=7)line(i,-19,i+3,-10,'#986338',2);if(walk){for(let i=0;i<4;i++){let a=-12+i*7;line(a,-7,a+Math.sin(phase+i*Math.PI/2)*5,3,k===1?'#eee':v,4)}}else ellipse(4,-2,15,4,v);ellipse(22,-21,1.5,1.5,'#d4c18c');x.restore()}
function frame(ms){let t=ms/1000,now=new Date(),h=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tokyo',hour:'2-digit',hourCycle:'h23'}).format(now));N=night===null?(h<6||h>=17):night;let sky=x.createLinearGradient(0,0,0,300);sky.addColorStop(0,N?'#26384f':'#a5c9d5');sky.addColorStop(1,N?'#697080':'#e5e6ce');rect(0,0,1000,600,sky);for(let i=0;i<4;i++)ellipse((i*290+t*3)%1200-100,60+i%2*30,96,18,N?'#8993a155':'#ffffff88');house(25,145,250,200,'#c9c4ac');house(315,110,245,210,'#ded8c3');house(710,140,270,220,'#c5bdb0');poly([[0,360],[1000,325],[1000,600],[0,600]],'#a7a49a');poly([[0,432],[1000,390],[1000,600],[0,600]],'#b9b8ad');for(let i=0;i<6;i++)line(610+i*70,390,650+i*70,535,'#e6e2d3',3);rect(0,330,310,58,'#858b82');rect(0,328,310,8,'#b9bcb0');for(let i=0;i<8;i++)line(i*42,337,i*42,387,'#9da197',1);for(let i=0;i<3;i++){let a=300+i*38;line(a,335,a-4,230,'#736c51',9);for(let j=0;j<5;j++)ellipse(a+Math.cos(j*2+t*.35)*20,230+Math.sin(j*2)*26,35,26,['#657a58','#89956b','#738a60'][j%3])}line(580,350,580,171,'#585e5c',7);line(580,171,610,171,'#585e5c',5);ellipse(610,175,12,5,N?'#ffdb8b':'#bfc7bd');
for(let k=0;k<3;k++){let q=(t+k*19)%65,walk=q<28||q>46, a=100+k*125+(q<28?q*9:q<46?252:(65-q)*13.26),b=465+k*22;cat(a,b,k,walk,q<46?1:-1,t*12)}
// Foreground vehicle masks cats as they pass behind it.
ellipse(785,503,132,17,'#44484055');for(let a of [703,861])ellipse(a,492,20,23,'#33393b');rect(665,436,235,50,'#768b8b');poly([[687,436],[724,399],[822,399],[865,436]],'#768b8b');poly([[708,435],[730,407],[770,407],[770,435]],'#acc2c4');poly([[779,407],[816,407],[845,435],[779,435]],'#acc2c4');rect(665,462,13,12,'#bd7369');rect(881,450,19,12,'#e4d6aa');if(N){rect(0,0,1000,600,'#14254477');let g=x.createRadialGradient(610,180,2,610,300,170);g.addColorStop(0,'#ffdb8355');g.addColorStop(1,'#ffdb8300');rect(420,120,380,370,g)}if(rain){rect(0,0,1000,600,'#40566b33');for(let i=0;i<130;i++){let a=(i*83+t*53)%1000,b=(i*127+t*530)%600;line(a,b,a-9,b+19,'#e5edf088',1)}for(let i=0;i<5;i++)ellipse(120+i*190,545-i%2*30,25+(t*12+i*7)%20,4,'#c1d5d855')}document.getElementById('clock').textContent=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',dateStyle:'medium',timeStyle:'short'}).format(now)+' JST';requestAnimationFrame(frame)}requestAnimationFrame(frame);
