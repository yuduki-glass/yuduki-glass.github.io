<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191918">
  <title>CAT WATCHING LOG | 結月硝子</title>
  <link rel="stylesheet" href="./observation.css">
  <script type="module" src="./observation.js"></script>
</head>
<body>
  <main>
    <header class="masthead">
      <a href="/">結月硝子</a>
      <span>猫指数観測所</span>
    </header>
    <section aria-labelledby="title">
      <div class="heading">
        <div>
          <h1 id="title">Cat Watching Log</h1>
          <p class="subtitle">夕暮れ、住宅街の路地</p>
        </div>
        <div class="clock" aria-label="風景の時刻">
          <time id="clock">17:15</time>
          <span id="period">夕暮れ</span>
        </div>
      </div>
      <figure>
        <div class="view">
          <canvas id="scene" width="1280" height="720" role="img" aria-label="日本の住宅街を、猫たちが行き来する動くピクセルアート">夕暮れの住宅街。手前の塀から、車のある駐車場を通って路地が遠くへ続いています。</canvas>
          <p id="status" role="status">風景を読み込み中</p>
        </div>
        <figcaption>
          <span>仮想観測映像</span>
          <div class="controls" aria-label="風景の表示設定">
            <label>
              <span>時刻</span>
              <select id="time-mode">
                <option value="cycle">一日の移ろい</option>
                <option value="morning">朝</option>
                <option value="day">昼</option>
                <option value="dusk">夕暮れ</option>
                <option value="night">夜</option>
              </select>
            </label>
            <button id="weather" type="button" aria-pressed="false">雨</button>
            <button id="pause" type="button" aria-pressed="false">一時停止</button>
          </div>
        </figcaption>
      </figure>
    </section>
    <footer>三毛・短尾<span>／</span>黒・白靴下<span>／</span>茶トラ・耳欠け</footer>
  </main>
</body>
</html>
