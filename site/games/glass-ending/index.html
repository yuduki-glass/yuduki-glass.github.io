</style></head><body><header><p>結月硝子 PRESENTS · DARK FANTASY RPG</p><h1>硝子の終焉</h1><p>第一章　灰の記憶と、最後の灯火</p></header><main class="wrap"><div class="hud"><span>主人公 <strong id="stats">Lv 1　HP 40/40</strong></span><span>記憶の欠片 <strong id="shards">0</strong></span><span>所持品 <strong id="items">なし</strong></span><span>目的 <strong id="quest">老人に話しかける</strong></span></div><div class="stage"><canvas id="field" width="768" height="432" aria-label="探索フィールド"></canvas><div class="caption" id="place"></div><div id="overlay"><h2>死なない世界で、何を失うのか。</h2><p>世界から死が消えて三百年。人は生き続け、愛した人の名前を忘れる。<br>あなたは、妹の記憶を取り戻すために旅立つ。</p><button class="primary" id="start">物語を始める</button><button id="continue" class="hidden">保存した物語を続ける</button></div></div><section class="panel"><div class="speaker" id="speaker">語り手</div><div class="dialogue" id="dialogue">移動：画面下の方向キー（長押し可） / 矢印キー　会話：話すボタン<br>光る場所に近づいて調べよう。自動保存対応。</div><div class="actions" id="actions"><button id="interact">調べる / 話す</button><button id="save">保存</button><button id="reset">最初から</button></div></section><div class="touch"><div class="pad"><span class="empty"></span><button data-dir="up">▲</button><span class="empty"></span><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><button class="primary" id="touchAct">話す / 調べる</button></div><div class="footer">※ 第一章のプレイアブル版。探索、会話分岐、ターン制戦闘、複数の結末、ローカルセーブを実装。音声は端末の設定に依存しません。</div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),c=$('field'),g=c.getContext('2d'),W=24,H=13,T=32,key='yuduki-glass-ending-v1';
const map=[
'########################',
'#......................#',
'#..#####...............#',
'#..#...#.......####....#',
'#..#...#.......#..#....#',
'#..#####.......####....#',
'#......................#',
'#..........###.........#',
'#..........#.#.........#',
'#..........###.........#',
'#......................#',
'#......................#',
'########################'];
const actors=[{id:'elder',x:6,y:6,name:'忘却の老人',color:'#cbb9a4'},{id:'child',x:18,y:8,name:'名をなくした少女',color:'#b7c5d9'},{id:'grave',x:19,y:3,name:'灰の墓標',color:'#91b9ce'},{id:'gate',x:21,y:10,name:'塔への門',color:'#d5ad72'},{id:'flower',x:3,y:9,name:'硝子の花',color:'#9dcbd3'}];
let s,mode='title',battle=null,choices=[],busy=false;const mobile=matchMedia('(max-width:759px)').matches; if(mobile){c.width=384;c.height=320;}let camX=0,camY=0;
function initial(){return {x:11,y:6,hp:40,maxHp:40,level:1,xp:0,shards:0,flower:false,elder:false,child:false,grave:false,enemy:false,mercy:0,turn:0,ending:null};}
function save(){try{localStorage.setItem(key,JSON.stringify(s));}catch(e){}}
function load(){try{let d=JSON.parse(localStorage.getItem(key));if(d&&Number.isInteger(d.x)&&d.x>0&&d.x<23&&Number.isInteger(d.y)&&d.y>0&&d.y<12&&typeof d.hp==='number'){return {...initial(),...d};}}catch(e){}return null;}
function say(name,txt,opts){$('speaker').textContent=name;$('dialogue').textContent=txt;choices=opts||[];buttons();}
function buttons(){const a=$('actions');a.innerHTML='';if(choices.length){choices.forEach(o=>{let b=document.createElement('button');b.textContent=o.label;b.onclick=()=>{choices=[];o.run();};a.appendChild(b);});}else{[['調べる / 話す',interact],['保存',()=>{save();say('記録','記憶はこの端末に刻まれた。');}],['最初から',restart]].forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=fn;a.appendChild(b);});}}
function update(){if(!s)return;$('stats').textContent='Lv '+s.level+'　HP '+s.hp+'/'+s.maxHp;$('shards').textContent=s.shards;$('items').textContent=s.flower?'硝子の花':'なし';$('quest').textContent=!s.elder?'老人に話しかける':!s.grave?'墓標を調べる':!s.enemy?'塔の門を目指す':'選んだ結末を生きる';$('place').textContent=s.ending?'終章 · 残響':'忘却の村 · 灰降る夜';}
function start(data){s=data||initial();mode='walk';$('overlay').classList.add('hidden');update();say('語り手','灰は雪のように降る。しかし、この村では誰も冬を覚えていない。\n村人のそばで E を押して話しかけよう。');save();}
function restart(){if(!confirm('最初から始める？ 現在の記録は上書きされる。'))return;start();}
function walk(dx,dy){if(mode!=='walk'||choices.length)return;let nx=s.x+dx,ny=s.y+dy;if(map[ny]?.[nx]!=='.')return;if(actors.some(a=>a.x===nx&&a.y===ny))return;s.x=nx;s.y=ny;s.turn++;update();if(s.turn%4===0)save();}
function nearby(){return actors.find(a=>Math.abs(a.x-s.x)+Math.abs(a.y-s.y)<=1);}
function interact(){if(mode!=='walk'||choices.length)return;let a=nearby();if(!a){say('語り手','風が灰を運んでいる。遠くで鐘が鳴った。');return;}
if(a.id==='flower'){if(s.flower){say('硝子の花','花は冷たく、手のひらの中で淡く光っている。');return;}s.flower=true;s.shards++;say('語り手','枯れない硝子の花を拾った。\n花弁の内側に、小さな文字が刻まれている。「いつか、あなたが忘れても」');}
if(a.id==='elder'){if(!s.elder){say('忘却の老人','「食事を二人分作る癖が抜けなくてね。誰と食べていたかは、もう覚えていないんだ」',[{label:'誰かを待っているの？',run:()=>{s.elder=true;s.shards++;say('忘却の老人','「そうかもしれない。待つことだけが、私に残った愛なのかもしれないね」\n老人は古びた鍵をあなたに渡した。');save();update();}},{label:'黙って隣に座る',run:()=>{s.elder=true;s.mercy++;s.shards++;say('語り手','二人は黙って灰を眺めた。\n「ありがとう」と老人は言った。誰に向けた礼か、彼自身にも分からなかった。');save();update();}}]);return;}say('忘却の老人','「もし塔へ行くなら、どうか思い出しておくれ。忘れることが、いつも救いとは限らないと」');}
if(a.id==='child'){if(!s.child){say('名をなくした少女','「お姉ちゃんがいた気がする。でも、顔が思い出せないの」',[{label:'きっと会える',run:()=>{s.child=true;s.mercy++;s.shards++;say('少女','「嘘でも、うれしい」\n少女は初めて笑った。');save();update();}},{label:'分からない、と答える',run:()=>{s.child=true;s.shards++;say('少女','「大人はみんなそう言うね。でも、あなたは目をそらさなかった」');save();update();}}]);return;}say('少女','「名前がなくても、誰かのことを好きでいられるかな」');}
if(a.id==='grave'){if(!s.grave){s.grave=true;s.shards+=2;say('墓標','墓標には同じ名前が何百回も刻まれている。\n「エリス」。それは老人が忘れた妻の名だった。\nその下には小さく「忘れても、毎晩二人分の夕食を」とある。');}else if(s.elder){say('墓標','あなたは老人に真実を伝えるべきだろうか。',[{label:'妻の名前を伝える',run:()=>{s.mercy++;s.shards++;say('語り手','老人は静かに泣いた。\n「エリス。そうだ、私はあの人を待っていた」\n涙とともに、忘れていた別れの痛みが戻った。');save();update();}},{label:'伝えずに花を供える',run:()=>{if(s.flower){s.flower=false;s.mercy++;}say('語り手','花は灰の中でかすかに輝いた。\n知らないままで守れる幸福もある。');save();update();}}]);return;}else say('墓標','「エリス」。知らない名前なのに、なぜか胸が痛む。');}
if(a.id==='gate'){if(!s.elder||!s.grave){say('封印された門','門は動かない。老人の鍵と、墓標に眠る記憶が必要らしい。');return;}if(!s.enemy){mode='battle';battle={hp:36,max:36,guard:false,turn:0};say('門を守る影','「死を取り戻せば、忘却に逃げていた者たちは再び喪失を知る。それでも進むか」',[{label:'剣を抜く',run:()=>{choices=[];battleTurn('start');}}]);return;}endingChoice();}
save();update();}
function battleTurn(action){if(mode!=='battle')return;let log='';if(action==='attack'){let dmg=8+Math.floor(Math.random()*6)+s.level*2;battle.hp=Math.max(0,battle.hp-dmg);log='影に '+dmg+' ダメージ。';}if(action==='heal'){s.hp=Math.min(s.maxHp,s.hp+14);log='灰の祈りでHPを14回復。';}if(action==='guard'){battle.guard=true;log='剣を構え、次の攻撃に備えた。';}
if(battle.hp<=0){mode='walk';s.enemy=true;s.level++;s.maxHp+=10;s.hp=s.maxHp;s.shards+=3;s.x=20;s.y=10;save();update();say('門を守る影','「強さとは、何かを奪えることではない。奪った後も覚えていられることだ」\n影は消え、塔の門が開いた。');return;}
if(action!=='start'){let dmg=(battle.turn%3===2?13:7)+Math.floor(Math.random()*4);if(battle.guard)dmg=Math.ceil(dmg/3);s.hp=Math.max(0,s.hp-dmg);battle.guard=false;log+='\n影の攻撃。'+dmg+' ダメージ。';battle.turn++;}
if(s.hp<=0){mode='walk';s.hp=s.maxHp;s.x=11;s.y=6;save();update();say('語り手','あなたは村の入口で目を覚ました。死のない世界は、倒れることさえ許さない。\n塔の影はまだ門で待っている。');return;}
update();say('門を守る影','影 HP '+battle.hp+'/'+battle.max+'　あなた HP '+s.hp+'/'+s.maxHp+'\n'+log,[{label:'斬る',run:()=>battleTurn('attack')},{label:'祈る（HP回復）',run:()=>battleTurn('heal')},{label:'防御',run:()=>battleTurn('guard')}]);}
function endingChoice(){mode='ending';say('塔の声','「妹の記憶を戻すには、世界に死を返さねばならない。\nだが、死を拒めば、誰も失わずに済む。代わりに誰も、愛した人を覚えていられない」',[{label:'死を世界に返す',run:()=>end('dawn')},{label:'忘却の世界を守る',run:()=>end('ash')},{label:'自分の記憶を差し出す',run:()=>end('glass')}]);}
function end(type){s.ending=type;save();update();const texts={dawn:['黎明の結末','最初の葬列が村を通った日、老人は妻の墓の前で微笑んだ。\n妹はあなたの名を呼んだ。\n人は再び死ぬようになった。だからこそ、今日という日を抱きしめた。'],ash:['灰の結末','世界は今日も穏やかだった。\n老人は二人分の夕食を作り、少女は誰かを探し続けた。\n妹はあなたを見て、丁寧に頭を下げた。\n誰も死なない。誰も覚えていない。'],glass:['硝子の結末',s.mercy>=2?'妹は記憶を取り戻した。老人は妻の名前を口にした。\n世界は変わらなかった。代わりに、あなたの名前だけが全員の記憶から消えた。\nそれでも少女は、あなたが座っていた場所に毎日花を置いた。':'妹は記憶を取り戻した。世界は変わらなかった。\nあなたの名は誰の記憶にも残らなかった。\n塔の窓辺に、一輪の硝子の花だけが咲いた。']};let [title,txt]=texts[type];say(title,txt,[{label:'物語を最初から読む',run:()=>{start();}},{label:'この結末を記録する',run:()=>{save();say('終幕','結末を保存した。画面を更新しても記録は残る。');}}]);}
function draw(){g.clearRect(0,0,c.width,c.height);camX=mobile?Math.max(0,Math.min(768-c.width,(s?s.x*T+16:384)-c.width/2)):0;camY=mobile?Math.max(0,Math.min(432-c.height,(s?s.y*T+16:216)-c.height/2)):0;g.save();g.translate(-camX,-camY);let time=Date.now()/1000;const rand=(x,y,n=0)=>{let v=Math.sin(x*127.1+y*311.7+n*71.3)*43758.5453;return v-Math.floor(v);};
for(let y=0;y<H;y++)for(let x=0;x<W;x++){
const X=x*T,Y=y*T,wall=map[y][x]==='#',r=rand(x,y);
if(wall){
g.fillStyle=['#273344','#303c4c','#354454'][Math.floor(r*3)];g.fillRect(X,Y,32,32);
g.fillStyle='#4d5a65';g.fillRect(X,Y,32,2);g.fillStyle='#141e2a';g.fillRect(X,Y+29,32,3);
g.fillStyle='#53606a';g.fillRect(X+(r>.5?15:7),Y+3,1,26);
g.fillStyle='#1b2735';g.fillRect(X,Y+15,32,2);
if(rand(x,y,2)>.6){g.fillStyle='#66747c';g.fillRect(X+8,Y+8,7,1);g.fillRect(X+12,Y+9,1,4);}
if(map[y+1]?.[x]==='.') {g.fillStyle='#171e2b';g.fillRect(X,Y+27,32,5);g.fillStyle='#7c786f';g.fillRect(X,Y+27,32,2);}
}else{
const path=(y===6||y===10||x===11||x===20)&&r>.13;
g.fillStyle=path?'#39434a':r>.45?'#202f35':'#1b2a31';g.fillRect(X,Y,32,32);
if(path){g.fillStyle='#536068';g.fillRect(X+2,Y+2,27,1);g.fillRect(X+1,Y+29,28,1);g.fillStyle='#29353d';g.fillRect(X+Math.floor(r*9),Y+13,20,1);}
else{g.fillStyle='#344a48';g.fillRect(X+5+r*9,Y+20,2,5);g.fillRect(X+15,Y+7+r*5,1,4);}
if(rand(x,y,3)>.73){g.fillStyle='#69747a';g.fillRect(X+6,Y+17,4,2);g.fillRect(X+10,Y+19,2,1);}
if(rand(x,y,4)>.84){g.fillStyle='#8c938a';g.fillRect(X+23,Y+9,1,5);g.fillRect(X+20,Y+12,6,1);}
}
}
function decoration(x,y,type){let X=x*T,Y=y*T;
