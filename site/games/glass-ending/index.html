"storyChapter"></small><h2 id="storyTitle"></h2><p id="storyText"></p><button id="storyNext">進む</button></div></div><div id="overlay"><h2>深淵機関</h2><p>死んだはずの星から、救難信号が届いた。<br>機体〈葬送鳥〉を操り、生きた要塞の心臓を破壊せよ。<br><strong>移動：左スティック / 画面ドラッグ / 矢印キー</strong><br>攻撃：自動連射（FIREで強化連射） / SPACE<br>敵を倒して資金を獲得。ショップで武器を永久購入・強化。FIRE長押しで波動砲をチャージ。</p><button id="start">侵蝕領域へ出撃</button></div></div><div id="controls"><div id="stick" aria-label="移動スティック"><div id="nub"></div></div><div id="controlRight"><button id="shopBtn">武器SHOP</button><button id="pause">一時停止</button><button id="bomb">殲滅波</button><button id="fire">FIRE<br>連射</button></div></div></main>
<script>
(()=>{
'use strict';
const c=document.getElementById('game'),g=c.getContext('2d'),$=id=>document.getElementById(id),W=960,H=540,TAU=Math.PI*2;

const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const SAVE='abyss-organ-weapon-shop-v1',catalog=[['forward','前方バルカン',90,1.5],['wave','波動砲',150,1.6],['rear','後方レーザー',220,1.7],['spread','拡散砲',180,1.6],['homing','追尾ミサイル',260,1.75],['armor','追加装甲',220,1.7],['engine','推進機関',140,1.6],['orb','随伴オーブ',300,1.9]];let save={money:0,levels:{}};try{let x=JSON.parse(localStorage.getItem(SAVE));if(x&&Number.isFinite(x.money)&&x.levels)save=x;}catch(e){}const lv=id=>Math.max(0,Math.floor(Number(save.levels[id])||0));function persist(){try{localStorage.setItem(SAVE,JSON.stringify(save));}catch(e){}}function earn(n){save.money+=n;persist();hud();}function showShop(){$('shopMoney').textContent=save.money.toLocaleString();$('shopGrid').innerHTML='';for(const [id,name,base,mult] of catalog){const level=lv(id),price=Math.ceil(base*Math.pow(mult,level)),b=document.createElement('button');b.disabled=save.money<price;b.innerHTML='<strong>'+name+' Lv.'+level+'</strong><span>次の強化 '+price.toLocaleString()+' G</span>';b.onclick=()=>{if(save.money<price)return;save.money-=price;save.levels[id]=level+1;persist();if(id==='orb')optionCount++;if(id==='armor')shield++;hud();showShop();};$('shopGrid').appendChild(b);}}function openShop(){if(mode==='shop')return;shopReturn=mode;mode='shop';$('shop').classList.add('open');showShop();}function closeShop(){$('shop').classList.remove('open');mode=shopReturn;hud();}
for(let i=0;i<100;i++)stars.push({x:rand(0,W),y:rand(0,H),r:rand(.5,2.4),v:rand(.25,2)});
function hud(){$('hp').textContent='■'.repeat(Math.max(0,player.hp))+'□'.repeat(Math.max(0,player.max-player.hp));$('score').textContent=String(score).padStart(6,'0');$('stage').textContent=stage;$('weapon').textContent='波動'+lv('wave')+' 随伴'+optionCount;$('money').textContent=save.money.toLocaleString();$('bombs').textContent=player.bombs;}
const chapters=[{title:'赤い海の胎動',text:'航行記録 01。死んだ惑星〈ネメシス〉から救難信号が届いた。\n発信者の名は、十七年前に失踪した姉だった。',boss:'肉海の母胎',after:'母胎の内部から人間の認識票が見つかった。\nこの惑星は、何かを食べて成長している。'},{title:'骨の墓標',text:'航行記録 02。惑星の地殻は無数の骨でできていた。\n骨の一本一本に、地球の艦船番号が刻まれている。',boss:'白骨の司祭',after:'司祭の胸部には地球軍の紋章があった。\nここは侵略者の巣ではない。廃棄された艦隊の墓場だ。'},{title:'夢見る神経網',text:'航行記録 03。無数の神経が私の記憶を再生する。\n姉の声が言った。「お願い、まだ撃たないで」',boss:'千眼の観測者',after:'観測者が見せたのは、地球から放たれた最初の攻撃だった。\n戦争を始めたのは、私たちだった。'},{title:'胎児の聖堂',text:'航行記録 04。心臓に近づくほど、敵は人間に似ていく。\n機体の通信回線に、私自身の幼い声が混じった。',boss:'未生の双子',after:'双子の一方は姉の記憶を持っていた。\nこの星は奪った命を、別の形で生かそうとしている。'},{title:'黒い機械庭園',text:'航行記録 05。肉と鋼鉄が同じ根から生えている。\n地球軍の極秘計画「深淵機関」が、ついに姿を現した。',boss:'鋼鉄の花嫁',after:'深淵機関は惑星を殺す兵器だった。\nだが星は兵器を取り込み、命として再構成していた。'},{title:'記憶の消化器官',text:'航行記録 06。ここには失われた人々の記憶が保存されている。\n姉は星に捕らわれたのではない。自ら中枢へ入ったのだ。',boss:'記憶を喰う王',after:'姉の最後の記録。「この星を壊せば、ここにいる全員がもう一度死ぬ」\nそれでも進むしかない。'},{title:'最後の心臓',text:'航行記録 07。救難信号の発信源に到達した。\n心臓の鼓動は、私の鼓動と完全に同期している。',boss:'星の心臓',after:'中枢は沈黙した。\nだが星の奥から、もうひとつの鼓動が聞こえる。\n姉の声が告げた。「次は、あなたが選んで」'}];function chapter(){return chapters[(stage-1)%chapters.length];}function story(title,text,after){storyReturn=mode;storyAfter=after||null;mode='story';$('storyChapter').textContent='CHAPTER '+stage+' / '+chapters.length;$('storyTitle').textContent=title;$('storyText').textContent=text;$('story').classList.add('open');}function nextStory(){$('story').classList.remove('open');mode=storyReturn;if(storyAfter){const cb=storyAfter;storyAfter=null;cb();}}$('storyNext').onclick=nextStory;
function reset(){frame=0;score=0;stage=1;kills=0;scroll=0;boss=null;shake=0;flash=0;nextBoss=0;upgradeNotice=0;optionTrails=[];optionCount=lv('orb');speedLevel=lv('engine');missile=false;weaponMode='normal';shield=lv('armor');charge=0;missileTick=0;enemies=[];shots=[];enemyShots=[];particles=[];pickups=[];player={x:125,y:270,hp:3,max:3,level:1,bombs:2,inv:90};joy={x:0,y:0};mode='play';$('overlay').classList.add('hidden');$('message').textContent='第1侵蝕層 / '+chapter().title;hud();story(chapter().title,chapter().text);}
function burst(x,y,col,n=14,power=5){for(let i=0;i<n;i++){let a=rand(0,TAU),v=rand(.5,power);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(15,43),max:43,col,r:rand(1.5,5)});}}
function fireAt(x,y){shots.push({x:x+30,y,vx:12+lv('forward')*.4,vy:0,dmg:1+Math.floor(lv('forward')/2),r:4});for(let i=1;i<=Math.min(3,lv('spread'));i++)for(const sign of [-1,1])shots.push({x:x+24,y,vx:10,vy:sign*(2+i),dmg:1+Math.floor(lv('spread')/3),r:4});if(lv('rear'))shots.push({x:x-24,y,vx:-12,vy:0,dmg:lv('rear'),r:5,rear:true});if(lv('homing')&&frame%Math.max(12,50-lv('homing')*4)===0)shots.push({x:x+24,y,vx:7,vy:0,dmg:2+lv('homing'),r:6,homing:true});}
function shoot(){fireAt(player.x,player.y);for(let i=0;i<Math.min(optionCount,24);i++)if(i%Math.max(1,Math.ceil(optionCount/6))===frame%Math.max(1,Math.ceil(optionCount/6))){const o=optionPosition(i);fireAt(o.x,o.y);}}
function waveShot(){if(!lv('wave'))return;const p=1+Math.floor(charge/45);shots.push({x:player.x+32,y:player.y,vx:14,vy:0,dmg:(3+lv('wave')*2)*p,r:8+p*3,laser:true,pierce:3+p});burst(player.x+30,player.y,'#a9e8ff',15,6);charge=0;}
function optionPosition(i){const gap=13,idx=(i+1)*gap,past=optionTrails[Math.min(optionTrails.length-1,idx)];if(past&&idx<optionTrails.length)return past;const tail=optionTrails[optionTrails.length-1]||player;const beyond=Math.max(0,idx-optionTrails.length+1);return {x:tail.x-beyond*2.2,y:tail.y+Math.sin(i*.8+frame*.04)*Math.min(18,beyond*.2)};}
const species=['eye','jaw','spore','eel','leech','mantis','sentry','skull','siren','mine','larva','priest'];function spawn(){const pool=species.slice(0,Math.min(species.length,4+stage*2)),type=pool[Math.floor(rand(0,pool.length))],y=rand(72,468),baseHp=stage+1;const extra={leech:2,mantis:1,sentry:4,skull:3,siren:2,mine:5,larva:0,priest:5}[type]||0;enemies.push({x:1010,y,base:y,phase:rand(0,TAU),type,hp:baseHp+extra,max:baseHp+extra,r:type==='mine'?33:type==='sentry'?32:26,t:0,shot:rand(55,115),armor:type==='sentry'?2:0});}
function bossSpawn(){const kind=(stage-1)%chapters.length;boss={x:1120,y:270,hp:115+stage*48,max:115+stage*48,t:0,shot:0,kind,phase:0};$('message').textContent='警告：'+chapter().boss+' 接近';shake=9;flash=14;}
function hostileShot(x,y,ang,speed=3.6){enemyShots.push({x,y,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,r:6});}
function bomb(){if(mode!=='play'||player.bombs<=0)return;player.bombs--;shake=16;flash=20;enemyShots=[];enemies.forEach(e=>{e.hp-=15;burst(e.x,e.y,'#d69ba4',8)});if(boss)boss.hp-=25;burst(player.x,player.y,'#a9e4f3',45,12);hud();}
function damage(){if(player.inv>0||mode!=='play')return;if(shield>0){shield--;player.inv=45;shake=5;burst(player.x,player.y,'#8de3f5',15);hud();return;}player.hp--;player.inv=100;speedLevel=0;missile=false;weaponMode='normal';shake=13;flash=11;burst(player.x,player.y,'#a4dbe8',27,7);hud();if(player.hp<=0){mode='over';$('overlay').classList.remove('hidden');$('overlay').innerHTML='<h2>機体、沈黙</h2><p>侵蝕は止まらない。<br>最終得点：'+score+'　到達段階：'+stage+'</p><button id="retry">再出撃</button>';$('retry').onclick=reset;}}
function pickup(x,y){let r=Math.random();if(r<.76)pickups.push({x,y,type:r<.66?'orb':'heal',t:0});}
function update(){
if(mode!=='play')return;frame++;scroll+=2+stage*.24;if(player.inv>0)player.inv--;if(shake>0)shake*=.84;if(flash>0)flash--;
let dx=joy.x+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=joy.y+(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len;}
player.x=clamp(player.x+dx*(4.1+speedLevel*1.25),35,W-75);player.y=clamp(player.y+dy*(4.1+speedLevel*1.25),56,H-56);optionTrails.unshift({x:player.x,y:player.y});if(optionTrails.length<Math.max(120,(optionCount+2)*13)){}else optionTrails.pop();
if(frame%Math.max(3,11-lv('forward'))===0)shoot();if(fireHeld||keys[' ']){charge=Math.min(150,charge+1);if(charge===150)waveShot();}else if(charge>0){if(charge>14)waveShot();else charge=0;}
if(!boss&&frame%Math.max(28,80-stage*7)===0)spawn();
if(!boss&&frame>=nextBoss+1450)bossSpawn();
enemies.forEach(e=>{e.t++;e.x-=2.5+stage*.32+(e.type==='eel'?2:e.type==='mantis'?3:e.type==='mine'?-0.5:0);e.y=e.base+Math.sin(e.t*(e.type==='siren'?.085:e.type==='mantis'?.09:.045)+e.phase)*(e.type==='eel'?50:e.type==='siren'?75:e.type==='mantis'?38:e.type==='mine'?5:23);if(e.type==='leech'&&e.t%110===0)e.base=clamp(player.y+rand(-80,80),65,475);e.shot--;if(e.shot<=0&&e.x<W-20){const a=Math.atan2(player.y-e.y,player.x-e.x);if(e.type==='sentry'||e.type==='priest'){for(let i=-1;i<=1;i++)hostileShot(e.x-12,e.y,a+i*.24,3+stage*.23);}else if(e.type==='mine'){for(let i=0;i<6;i++)hostileShot(e.x,e.y,i*TAU/6,2.4+stage*.1);}else if(e.type==='skull'){for(let i=0;i<3;i++)hostileShot(e.x,e.y,Math.PI+Math.sin(e.t*.1+i)*.55,3.4);}else hostileShot(e.x-12,e.y,a,3+stage*.28);e.shot=rand(e.type==='sentry'?55:75,145);}if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+19)damage();});
if(boss){boss.t++;boss.x+=(W-155-boss.x)*.018;boss.y=270+Math.sin(boss.t*(.014+boss.kind*.001))* (boss.kind===1?60:boss.kind===3?145:105);boss.shot++;const phase=Math.floor(boss.t/220)%3;boss.phase=phase;if(boss.shot%Math.max(19,38-stage)===0){let a=Math.atan2(player.y-boss.y,player.x-boss.x);if(boss.kind===0){for(let i=-2;i<=2;i++)hostileShot(boss.x-85,boss.y,a+i*.2,3.4+stage*.2);}else if(boss.kind===1){for(let i=0;i<8;i++)hostileShot(boss.x-80,boss.y,i*TAU/8+boss.t*.015,3.2);}else if(boss.kind===2){for(let i=-3;i<=3;i++)hostileShot(boss.x-85,boss.y,a+i*.16,3.8);}else if(boss.kind===3){for(let i=-1;i<=1;i++){hostileShot(boss.x-80,boss.y-50,a+i*.24,4);hostileShot(boss.x-80,boss.y+50,a+i*.24,4);}}else if(boss.kind===4){for(let i=0;i<10;i++)hostileShot(boss.x-80,boss.y,i*TAU/10+phase*.3,2.8+phase*.6);}else if(boss.kind===5){for(let i=-4;i<=4;i++)hostileShot(boss.x-85,boss.y,a+i*.12,3+phase);}else{for(let i=0;i<12;i++)hostileShot(boss.x-80,boss.y,i*TAU/12+boss.t*.007,3.5+phase*.35);}}if(Math.hypot(boss.x-80-player.x,boss.y-player.y)<82)damage();}
shots.forEach(s=>{if(s.homing){let t=boss||enemies[0];if(t)s.vy=clamp(s.vy+(t.y-s.y)*.004,-5,5);}s.x+=s.vx;s.y+=s.vy;let targets=boss?[...enemies,boss]:enemies;for(const e of targets){if(Math.hypot(s.x-e.x,s.y-e.y)<(e===boss?83:e.r)+s.r){e.hp-=s.dmg;if(s.laser&&s.pierce>0){s.pierce--;s.x+=22;}else s.x=W+999;burst(e.x,e.y,'#e8a6b0',3,2);break;}}});
enemyShots.forEach(s=>{s.x+=s.vx;s.y+=s.vy;if(Math.hypot(s.x-player.x,s.y-player.y)<s.r+14){s.x=-999;damage();}});
for(const e of enemies){if(e.hp<=0){score+=110*stage;kills++;earn(18+stage*6);burst(e.x,e.y,'#c74c6e',22,7);pickup(e.x,e.y);e.x=-999;}}
if(boss&&boss.hp<=0){const ending=chapter().after,cleared=chapter().boss;score+=5000*stage;earn(400*stage);burst(boss.x,boss.y,'#e97091',100,14);boss=null;stage++;nextBoss=frame;player.hp=Math.min(player.max,player.hp+1);player.bombs++;player.level=Math.min(6,player.level+1);$('message').textContent='撃破：'+cleared;shake=20;flash=22;hud();story('断章：'+cleared,ending,()=>{story(chapter().title,chapter().text);$('message').textContent='第'+stage+'侵蝕層 / '+chapter().title;});}
pickups.forEach(p=>{p.x-=2;p.t++;if(Math.hypot(p.x-player.x,p.y-player.y)<28){if(p.type==='orb'){optionCount++;upgradeNotice=100;$('message').textContent='追従オーブ '+optionCount+' 個　攻撃力増強！';burst(player.x,player.y,'#f8b5d4',28,9);flash=7;}else{player.hp=Math.min(player.max,player.hp+1);$('message').textContent='機体修復';}score+=250;burst(p.x,p.y,p.type==='orb'?'#fa799f':'#83d6ed',14);p.x=-999;hud();}});
particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;p.life--;});
enemies=enemies.filter(e=>e.x>-65);shots=shots.filter(s=>s.x<W+40&&s.y>-30&&s.y<H+30);enemyShots=enemyShots.filter(s=>s.x>-40&&s.x<W+40&&s.y>-40&&s.y<H+40);particles=particles.filter(p=>p.life>0);pickups=pickups.filter(p=>p.x>-30);
if(upgradeNotice>0)upgradeNotice--;if(frame%60===0)hud();
}
function ellipse(x,y,rx,ry,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fill();}
function line(points,col,w=2){g.strokeStyle=col;g.lineWidth=w;g.beginPath();points.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();}
function backdrop(){
const grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#090a18');grad.addColorStop(.5,'#1c101f');grad.addColorStop(1,'#080b14');g.fillStyle=grad;g.fillRect(0,0,W,H);
for(const s of stars){s.x-=s.v*.35;if(s.x<0)s.x=W;ellipse(s.x,s.y,s.r,s.r,'#9a91ac77');}
for(let layer=0;layer<3;layer++){let off=(scroll*(.2+layer*.36))%200;for(let i=-1;i<7;i++){let x=i*200-off,y=layer===0?30:layer===1?H-30:0;g.fillStyle=['#151625','#221624','#321922'][layer];g.beginPath();g.moveTo(x,0);g.bezierCurveTo(x+55,55+layer*30,x+75,110+layer*15,x+105,140+layer*12);g.bezierCurveTo(x+140,180,x+175,75,x+200,0);g.closePath();g.fill();g.beginPath();g.moveTo(x,H);g.bezierCurveTo(x+40,H-80,x+90,H-140,x+120,H-120);g.bezierCurveTo(x+170,H-100,x+180,H-45,x+200,H);g.closePath();g.fill();}}
for(let i=0;i<15;i++){let x=((i*137-scroll*.7)%(W+180)+(W+180))%(W+180)-80,y=i%2?H-25:25;ellipse(x,y,rand(4,7),12,'#6d28344d');line([[x,y],[x-8,y+(i%2?-28:28)],[x-16,y+(i%2?-41:41)]],'#74364566',3);}
for(let i=0;i<9;i++){let x=((i*179-scroll*1.2)%(W+160)+(W+160))%(W+160)-60,y=i%2?H-12:12;ellipse(x,y,12,18,'#762c43');ellipse(x,y,5,9,'#da6a7a');}
}
function ship(){
if(player.inv>0&&frame%6<3)return;
g.save();g.translate(player.x,player.y);let tilt=clamp(joy.y,-1,1);g.rotate(tilt*.12);
g.fillStyle='#a1c4d2';g.beginPath();g.moveTo(34,0);g.lineTo(-11,-13);g.lineTo(-25,-9);g.lineTo(-20,0);g.lineTo(-25,9);g.lineTo(-11,13);g.closePath();g.fill();
g.fillStyle='#344c62';g.beginPath();g.moveTo(11,0);g.lineTo(-19,-26);g.lineTo(-9,-4);g.lineTo(-19,26);g.closePath();g.fill();
g.fillStyle='#b6b8bd';g.beginPath();g.moveTo(-4,-6);g.lineTo(19,0);g.lineTo(-4,6);g.closePath();g.fill();
ellipse(4,0,10,5,'#72d8ed');ellipse(-23,0,8+Math.sin(frame*.7)*4,5,'#6bdeff');ellipse(-31,0,12+Math.random()*8,3,'#c7e9ff88');
if(player.level>=3){ellipse(-6,-24,4,4,'#ed7c9e');ellipse(-6,24,4,4,'#ed7c9e');}
g.restore();
}
function monster(e){g.save();g.translate(e.x,e.y);const pulse=1+Math.sin(frame*.09+e.phase)*.1;g.scale(pulse,pulse);
if(e.type==='eye'){ellipse(0,0,26,20,'#5a263f');ellipse(-3,0,17,14,'#d48c9b');ellipse(-5,0,9,10,'#241625');ellipse(-7,0,4,6,'#f8d1c8');for(let i=0;i<7;i++){let a=i*TAU/7;line([[15*Math.cos(a),15*Math.sin(a)],[35*Math.cos(a),35*Math.sin(a)]],'#8e3657',3);}}
else if(e.type==='jaw'){ellipse(0,0,27,23,'#622d41');ellipse(-8,0,19,16,'#150e1a');for(let i=-3;i<=3;i++){line([[-16,i*4],[-2,i*4+2]],'#d7b5ac',3);}ellipse(19,-8,8,7,'#b94961');}
else if(e.type==='spore'){for(let i=0;i<6;i++){let a=i*TAU/6+frame*.012;ellipse(Math.cos(a)*18,Math.sin(a)*18,11,8,'#78314b');}ellipse(0,0,20,20,'#b05c6c');ellipse(-4,0,8,8,'#241622');}
else if(e.type==='eel'){ellipse(0,0,34,15,'#703449');for(let i=0;i<5;i++)ellipse(-23+i*12,Math.sin(frame*.13+i)*9,9,11,'#9b4b62');ellipse(-15,0,9,8,'#f1a0a7');ellipse(-17,0,4,5,'#251725');}
else if(e.type==='leech'){ellipse(0,0,31,13,'#672439');for(let i=0;i<5;i++)ellipse(-19+i*10,Math.sin(frame*.12+i)*7,8,10,'#d17b8c');ellipse(-25,0,12,10,'#1b1019');}
else if(e.type==='mantis'){ellipse(0,0,17,24,'#567166');line([[-8,-10],[-40,-35],[-55,-14]],'#b7d4a0',6);line([[-8,10],[-40,35],[-55,14]],'#b7d4a0',6);ellipse(-9,0,7,9,'#f1c0a0');}
else if(e.type==='sentry'){ellipse(0,0,29,30,'#4c5266');ellipse(-12,0,14,15,'#c77e8f');for(let i=0;i<6;i++){let a=i*TAU/6;line([[0,0],[Math.cos(a)*39,Math.sin(a)*39]],'#89909d',5);}}
else if(e.type==='skull'){ellipse(0,0,28,24,'#ddd0b6');ellipse(-11,-6,8,10,'#281724');ellipse(11,-6,8,10,'#281724');for(let i=-2;i<=2;i++)line([[i*7,8],[i*7,19]],'#5c3641',3);}
else if(e.type==='siren'){ellipse(0,0,19,23,'#a678a1');for(let i=0;i<6;i++){let a=i*TAU/6;line([[0,0],[Math.cos(a)*39,Math.sin(a)*39]],'#c99dbb',4);}ellipse(-8,0,7,10,'#e3d4ef');}
else if(e.type==='mine'){ellipse(0,0,30,30,'#43414b');for(let i=0;i<9;i++){let a=i*TAU/9;line([[Math.cos(a)*20,Math.sin(a)*20],[Math.cos(a)*45,Math.sin(a)*45]],'#c1a5a0',5);}ellipse(-6,0,10,10,'#e84b6c');}
else if(e.type==='larva'){ellipse(0,0,29,17,'#b8a08c');for(let i=0;i<5;i++)ellipse(-22+i*10,0,9,15,'#d3b4a0');ellipse(-24,-3,4,5,'#512e3b');}
else if(e.type==='priest'){ellipse(0,0,22,30,'#998a86');ellipse(-12,0,13,20,'#301a28');for(let i=-2;i<=2;i++)line([[0,i*8],[35,i*10]],'#d5bdab',3);ellipse(-14,0,7,10,'#f0d2bc');}
g.restore();}
function drawBoss(){if(!boss)return;const b=boss;g.save();g.translate(b.x,b.y);let p=Math.sin(frame*.05);const colors=[['#51253b','#9a425a','#ce6a78'],['#55505d','#a69b98','#e0d5b8'],['#322944','#68538a','#a48ad0'],['#56374a','#a76c91','#e9abc5'],['#293b43','#477982','#a2c9bd'],['#48304b','#82567b','#d2a6bb'],['#2a243d','#7e3a68','#ed799d']][b.kind];
for(let i=0;i<9;i++){let a=i*TAU/9+frame*.003;let x=Math.cos(a)*93,y=Math.sin(a)*103;line([[0,0],[x,y],[x+Math.cos(a)*30,y+Math.sin(a)*35]],'#63253e',10);ellipse(x,y,18,22,'#9c3b56');}
ellipse(0,0,101+p*5,117+p*4,colors[0]);ellipse(-15,0,78,94,colors[1]);ellipse(-25,0,60,76,colors[2]);ellipse(-35,0,40,50,'#351a2a');ellipse(-44,0,25,33,'#f7a3a0');ellipse(-48,0,15,22,'#1a1221');ellipse(-55,-5,6,9,'#fff0dc');
for(let i=-3;i<=3;i++){line([[-70,i*17],[-91,i*18+6]],'#e4a7a4',4);}
if(b.kind===1){for(let i=-3;i<=3;i++)line([[-50,i*27],[-130,i*29]],'#f2e3cc',8);}if(b.kind===2){for(let i=0;i<12;i++){let a=i*TAU/12;ellipse(Math.cos(a)*80,Math.sin(a)*90,12,15,'#e6c9f5');ellipse(Math.cos(a)*80-3,Math.sin(a)*90,5,8,'#25152f');}}if(b.kind===3){ellipse(15,-48,35,42,'#e7b1d0');ellipse(15,48,35,42,'#e7b1d0');}if(b.kind===4){for(let i=0;i<8;i++){let a=i*TAU/8;line([[0,0],[Math.cos(a)*135,Math.sin(a)*140]],'#8fc7bc',6);}}if(b.kind===5){for(let i=0;i<6;i++)ellipse(30+i*5-15,Math.sin(frame*.04+i)*60,9,13,'#edb5d2');}if(b.kind===6){ellipse(-43,0,36,49,'#ffb4c9');ellipse(-49,0,19,31,'#241324');}g.restore();
g.fillStyle='#250f19';g.fillRect(270,14,430,12);g.fillStyle='#d55e79';g.fillRect(272,16,426*Math.max(0,b.hp/b.max),8);g.strokeStyle='#e8b0a7';g.strokeRect(270,14,430,12);g.fillStyle='#f3c1b8';g.font='13px system-ui';g.textAlign='center';g.fillText(chapter().boss+' / ORGAN CORE',W/2,44);g.textAlign='left';}
function render(){
g.save();if(shake>.4)g.translate(rand(-shake,shake),rand(-shake,shake));backdrop();
for(const p of pickups){g.save();g.translate(p.x,p.y);g.rotate(frame*.035);g.fillStyle=p.type==='orb'?'#e96289':'#71d4ef';g.beginPath();g.moveTo(0,-14);g.lineTo(12,0);g.lineTo(0,14);g.lineTo(-12,0);g.closePath();g.fill();g.restore();}
enemies.forEach(monster);drawBoss();for(let i=Math.min(optionCount,35)-1;i>=0;i--){const o=optionPosition(i);ellipse(o.x,o.y,11,11,'#7e5a72');ellipse(o.x,o.y,7,7,'#f1b0b5');ellipse(o.x+2,o.y,3,3,'#f7e9cf');}
for(const s of shots){ellipse(s.x,s.y,s.laser?32:s.r*2,s.laser?6:s.r,s.laser?'#f9a9bf':s.missile?'#ffbc75':'#a9eaf9');ellipse(s.x-12,s.y,s.r*2,s.r*.5,'#7de0ff66');}
for(const s of enemyShots){ellipse(s.x,s.y,s.r,s.r,'#fa7395');ellipse(s.x,s.y,2,2,'#ffe7db');}
ship();if(charge&&lv('wave')){g.fillStyle='#3a283d';g.fillRect(player.x-25,player.y-40,60,6);g.fillStyle='#a6e8f6';g.fillRect(player.x-25,player.y-40,60*charge/150,6);}if(upgradeNotice>0){g.save();g.globalAlpha=Math.min(1,upgradeNotice/25);g.font='bold 24px system-ui';g.textAlign='center';g.fillStyle='#ffd0df';g.shadowColor='#f3599a';g.shadowBlur=20;g.fillText('ORBITAL LINK  '+optionCount,W/2,92);g.restore();}if(shield>0){g.strokeStyle='#8cdef5';g.lineWidth=3;g.globalAlpha=.55+Math.sin(frame*.15)*.15;g.beginPath();g.ellipse(player.x,player.y,40,32,0,0,TAU);g.stroke();g.globalAlpha=1;}for(const p of particles){g.globalAlpha=clamp(p.life/p.max,0,1);ellipse(p.x,p.y,p.r,p.r,p.col);}g.globalAlpha=1;if(flash>0){g.fillStyle='rgba(255,189,210,'+(flash/70)+')';g.fillRect(0,0,W,H);}g.restore();
if(mode==='pause'){g.fillStyle='#050711bd';g.fillRect(0,0,W,H);g.fillStyle='#f0c4c1';g.font='38px serif';g.textAlign='center';g.fillText('一時停止',W/2,H/2);g.textAlign='left';}
}
function loop(){update();render();requestAnimationFrame(loop);}
function togglePause(){if(mode==='play'){mode='pause';$('pause').textContent='再開';}else if(mode==='pause'){mode='play';$('pause').textContent='一時停止';}}
$('shopBtn').onclick=openShop;$('closeShop').onclick=closeShop;$('start').onclick=reset;$('pause').onclick=togglePause;$('bomb').onclick=bomb;
const fire=$('fire');fire.addEventListener('pointerdown',e=>{fireHeld=true;fire.setPointerCapture(e.pointerId);});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>fire.addEventListener(ev,()=>fireHeld=false));
const stick=$('stick'),nub=$('nub');let stickId=null;
function moveStick(e){const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=r.width*.34,l=Math.hypot(dx,dy),k=l>max?max/l:1;joy.x=dx*k/max;joy.y=dy*k/max;nub.style.transform='translate(calc(-50% + '+dx*k+'px),calc(-50% + '+dy*k+'px))';}
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e);});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e);});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>stick.addEventListener(ev,e=>{if(e.pointerId===stickId){stickId=null;joy={x:0,y:0};nub.style.transform='translate(-50%,-50%)';}}));
let dragId=null,origin=null;c.addEventListener('pointerdown',e=>{if(mode!=='play')return;dragId=e.pointerId;origin={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId);});c.addEventListener('pointermove',e=>{if(e.pointerId!==dragId||!origin)return;const r=c.getBoundingClientRect(),dx=(e.clientX-origin.x)/r.width*W,dy=(e.clientY-origin.y)/r.height*H,l=Math.hypot(dx,dy);joy.x=l>12?clamp(dx/65,-1,1):0;joy.y=l>12?clamp(dy/65,-1,1):0;});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>c.addEventListener(ev,e=>{if(e.pointerId===dragId){dragId=null;origin=null;joy={x:0,y:0};}}));
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key==='b'||e.key==='B')bomb();if(e.key==='q'||e.key==='Q'){if(mode==='shop')closeShop();else openShop();}if(e.key==='Escape'||e.key==='p')togglePause();});document.addEventListener('keyup',e=>keys[e.key]=false);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')togglePause();});
hud();loop();
})();
</script></body></html>
