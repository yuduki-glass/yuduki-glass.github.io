@media(max-width:759px){.pad{display:none}.touch{justify-content:flex-end;background:#0c1523cc}.touch>.primary{min-height:48px;min-width:110px}.stage{touch-action:none}#joystick{display:block}}#joystick{display:none;position:absolute;z-index:4;width:112px;height:112px;left:20px;bottom:14px;pointer-events:none;touch-action:none;opacity:.75}#joystick .ring{position:absolute;inset:0;border:2px solid #a6d9df88;border-radius:50%;background:radial-gradient(circle,#547b8755,#172e3e88);box-shadow:0 0 22px #8cced32a,inset 0 0 15px #8cced322}#joystick .nub{position:absolute;left:34px;top:34px;width:44px;height:44px;border-radius:50%;border:2px solid #c7e9e9;background:linear-gradient(135deg,#a2cfd4,#37546a);box-shadow:0 2px 14px #0008}#joystick.active{opacity:1}@media(max-width:759px) and (max-height:650px){#joystick{width:90px;height:90px;bottom:8px}#joystick .nub{width:36px;height:36px;left:27px;top:27px}}.move-controls{display:flex;gap:6px}.move-controls #pace{border-color:#8baeb5;color:#cde7ea}@media(max-width:759px){.move-controls button{min-height:48px;padding:8px;font-size:13px}} .stage #world3d{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}.stage #field{position:relative;z-index:0}.stage #joystick{z-index:4}.stage .caption{z-index:5}.stage #overlay{z-index:7} </style></head><body><header><p>結月硝子 PRESENTS · DARK FANTASY RPG</p><h1>硝子の終焉</h1><p>第一章　灰の記憶と、最後の灯火</p></header><main class="wrap"><div class="hud"><span>主人公 <strong id="stats">Lv 1　HP 40/40</strong></span><span>記憶の欠片 <strong id="shards">0</strong></span><span>所持品 <strong id="items">なし</strong></span><span>目的 <strong id="quest">老人に話しかける</strong></span></div><div class="stage"><canvas id="field" width="768" height="432" aria-label="探索フィールド"></canvas><div class="caption" id="place"></div><div id="joystick"><div class="ring"></div><div class="nub"></div></div><div id="overlay"><h2>死なない世界で、何を失うのか。</h2><p>世界から死が消えて三百年。人は生き続け、愛した人の名前を忘れる。<br>あなたは、妹の記憶を取り戻すために旅立つ。</p><button class="primary" id="start">物語を始める</button><button id="continue" class="hidden">保存した物語を続ける</button></div></div><section class="panel"><div class="speaker" id="speaker">語り手</div><div class="dialogue" id="dialogue">移動：画面下の方向キー（長押し可） / 矢印キー　会話：話すボタン<br>光る場所に近づいて調べよう。自動保存対応。</div><div class="actions" id="actions"><button id="interact">調べる / 話す</button><button id="save">保存</button><button id="reset">最初から</button></div></section><div class="touch"><div class="pad"><span class="empty"></span><button data-dir="up">▲</button><span class="empty"></span><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><div class="move-controls"><button id="pace">歩く</button><button class="primary" id="touchAct">話す / 調べる</button></div></div><div class="footer">※ 第一章のプレイアブル版。探索、会話分岐、ターン制戦闘、複数の結末、ローカルセーブを実装。音声は端末の設定に依存しません。</div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),c=$('field'),g=c.getContext('2d'),W=24,H=13,T=32,key='yuduki-glass-ending-v1';
const map=[
'########################',
'#......................#',
'#..#####...............#',
'#..#...#.......####....#',
'#..#...#.......#..#....#',
'#..#####.......####....#',
'#......................#',
'#..........###.........#',
'#..........#.#.........#',
'#..........###.........#',
'#......................#',
'#......................#',
'########################'];
const villageActors=[{id:'elder',x:6,y:6,name:'忘却の老人',color:'#cbb9a4'},{id:'child',x:18,y:8,name:'名をなくした少女',color:'#b7c5d9'},{id:'grave',x:19,y:3,name:'灰の墓標',color:'#91b9ce'},{id:'gate',x:21,y:10,name:'塔への門',color:'#d5ad72'},{id:'flower',x:3,y:9,name:'硝子の花',color:'#9dcbd3'}];
let s,mode='title',battle=null,choices=[],busy=false,pace='walk',lastStep=0;const actors2=[{id:'keeper',x:6,y:6,name:'記録守リラ'},{id:'mirror',x:19,y:3,name:'記憶鏡'},{id:'altar',x:3,y:9,name:'忘却の祭壇'},{id:'seal',x:21,y:10,name:'聖堂の扉'}];let actors=villageActors;const mobile=matchMedia('(max-width:759px)').matches; if(mobile){c.width=384;c.height=320;}let camX=0,camY=0;
function initial(){return {x:11,y:6,hp:40,maxHp:40,level:1,xp:0,shards:0,flower:false,elder:false,child:false,grave:false,enemy:false,mercy:0,turn:0,ending:null,chapter:1,keeper:false,mirror:false,altar:false,secondBoss:false,chapter2End:null};}
function save(){try{localStorage.setItem(key,JSON.stringify(s));}catch(e){}}
function load(){try{let d=JSON.parse(localStorage.getItem(key));if(d&&Number.isInteger(d.x)&&d.x>0&&d.x<23&&Number.isInteger(d.y)&&d.y>0&&d.y<12&&typeof d.hp==='number'){return {...initial(),...d};}}catch(e){}return null;}
function say(name,txt,opts){$('speaker').textContent=name;$('dialogue').textContent=txt;choices=opts||[];buttons();}
function buttons(){const a=$('actions');a.innerHTML='';if(choices.length){choices.forEach(o=>{let b=document.createElement('button');b.textContent=o.label;b.onclick=()=>{choices=[];o.run();};a.appendChild(b);});}else{[['調べる / 話す',interact],['保存',()=>{save();say('記録','記憶はこの端末に刻まれた。');}],['最初から',restart]].forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=fn;a.appendChild(b);});}}
function update(){if(!s)return;actors=s.chapter===2?actors2:villageActors;$('stats').textContent='Lv '+s.level+'　HP '+s.hp+'/'+s.maxHp;$('shards').textContent=s.shards;$('items').textContent=s.flower?'硝子の花':'なし';$('quest').textContent=!s.elder?'老人に話しかける':!s.grave?'墓標を調べる':!s.enemy?'塔の門を目指す':'選んだ結末を生きる';if(s.chapter===2)$('quest').textContent=!s.keeper?'記録守に会う':!s.mirror?'記憶鏡を調べる':!s.altar?'祭壇を調べる':!s.secondBoss?'聖堂の扉へ':'記録を残す';$('place').textContent=s.chapter===2?'第二章 · 沈黙の回廊':s.ending?'終章 · 残響':'忘却の村 · 灰降る夜';}
function start(data){s=data||initial();mode='walk';$('overlay').classList.add('hidden');update();say('語り手',s.chapter===2?'第二章「沈黙の回廊」\n塔の地下には忘れられた声が眠っている。':'灰は雪のように降る。しかし、この村では誰も冬を覚えていない。\n村人のそばで E を押して話しかけよう。');save();}
function restart(){if(!confirm('最初から始める？ 現在の記録は上書きされる。'))return;start();}
function walk(dx,dy){if(mode!=='walk'||choices.length)return;let now=performance.now();if(now-lastStep<(pace==='run'?150:340))return;lastStep=now;let nx=s.x+dx,ny=s.y+dy;if(map[ny]?.[nx]!=='.')return;if(actors.some(a=>a.x===nx&&a.y===ny))return;s.x=nx;s.y=ny;s.turn++;update();if(s.turn%4===0)save();}
function nearby(){return actors.find(a=>Math.abs(a.x-s.x)+Math.abs(a.y-s.y)<=1);}
function interact(){if(mode!=='walk'||choices.length)return;let a=nearby();if(!a){say('語り手','風が灰を運んでいる。遠くで鐘が鳴った。');return;}
if(s.chapter===2){interact2(a);return;}if(a.id==='flower'){if(s.flower){say('硝子の花','花は冷たく、手のひらの中で淡く光っている。');return;}s.flower=true;s.shards++;say('語り手','枯れない硝子の花を拾った。\n花弁の内側に、小さな文字が刻まれている。「いつか、あなたが忘れても」');}
if(a.id==='elder'){if(!s.elder){say('忘却の老人','「食事を二人分作る癖が抜けなくてね。誰と食べていたかは、もう覚えていないんだ」',[{label:'誰かを待っているの？',run:()=>{s.elder=true;s.shards++;say('忘却の老人','「そうかもしれない。待つことだけが、私に残った愛なのかもしれないね」\n老人は古びた鍵をあなたに渡した。');save();update();}},{label:'黙って隣に座る',run:()=>{s.elder=true;s.mercy++;s.shards++;say('語り手','二人は黙って灰を眺めた。\n「ありがとう」と老人は言った。誰に向けた礼か、彼自身にも分からなかった。');save();update();}}]);return;}say('忘却の老人','「もし塔へ行くなら、どうか思い出しておくれ。忘れることが、いつも救いとは限らないと」');}
if(a.id==='child'){if(!s.child){say('名をなくした少女','「お姉ちゃんがいた気がする。でも、顔が思い出せないの」',[{label:'きっと会える',run:()=>{s.child=true;s.mercy++;s.shards++;say('少女','「嘘でも、うれしい」\n少女は初めて笑った。');save();update();}},{label:'分からない、と答える',run:()=>{s.child=true;s.shards++;say('少女','「大人はみんなそう言うね。でも、あなたは目をそらさなかった」');save();update();}}]);return;}say('少女','「名前がなくても、誰かのことを好きでいられるかな」');}
if(a.id==='grave'){if(!s.grave){s.grave=true;s.shards+=2;say('墓標','墓標には同じ名前が何百回も刻まれている。\n「エリス」。それは老人が忘れた妻の名だった。\nその下には小さく「忘れても、毎晩二人分の夕食を」とある。');}else if(s.elder){say('墓標','あなたは老人に真実を伝えるべきだろうか。',[{label:'妻の名前を伝える',run:()=>{s.mercy++;s.shards++;say('語り手','老人は静かに泣いた。\n「エリス。そうだ、私はあの人を待っていた」\n涙とともに、忘れていた別れの痛みが戻った。');save();update();}},{label:'伝えずに花を供える',run:()=>{if(s.flower){s.flower=false;s.mercy++;}say('語り手','花は灰の中でかすかに輝いた。\n知らないままで守れる幸福もある。');save();update();}}]);return;}else say('墓標','「エリス」。知らない名前なのに、なぜか胸が痛む。');}
if(a.id==='gate'){if(!s.elder||!s.grave){say('封印された門','門は動かない。老人の鍵と、墓標に眠る記憶が必要らしい。');return;}if(s.ending){say('塔の門','その選択の先に、まだ物語は続いている。',[{label:'第二章へ進む',run:nextChapter},{label:'村に残る',run:()=>say('語り手','灰が静かに降っている。')}]);return;}if(!s.enemy){mode='battle';battle={hp:36,max:36,guard:false,turn:0};say('門を守る影','「死を取り戻せば、忘却に逃げていた者たちは再び喪失を知る。それでも進むか」',[{label:'剣を抜く',run:()=>{choices=[];battleTurn('start');}}]);return;}endingChoice();}
save();update();}

function nextChapter(){s.chapter=2;s.x=11;s.y=6;s.hp=s.maxHp;mode='walk';choices=[];actors=actors2;save();update();say('第二章　沈黙の回廊','塔の地下。壁には消された名前が幾重にも刻まれていた。\n忘却は病ではない。誰かが意図して記憶を奪っている。');}
function interact2(a){
if(!a){say('回廊','水滴の音だけが聞こえる。');return;}
if(a.id==='keeper'){if(!s.keeper){say('記録守リラ','「選ばれなかった記憶はどこへ行くと思う？」',[{label:'失われたのでは？',run:()=>{s.keeper=true;s.shards++;say('リラ','「違う。ここに封じられている。私たちは忘れた者の代わりに覚えているの」');save();update();}},{label:'誰が奪ったの？',run:()=>{s.keeper=true;s.mercy++;s.shards++;say('リラ','「塔を作ったのは王ではない。誰かを忘れたくなかった、ただ一人の人間よ」');save();update();}}]);return;}say('リラ','「鏡を見て。あなたが選ばなかった未来も、ここにはある」');}
if(a.id==='mirror'){if(!s.keeper){say('記憶鏡','先に記録守の話を聞こう。');return;}if(!s.mirror){s.mirror=true;s.shards+=2;say('割れた記憶鏡',s.ending==='dawn'?'死を取り戻した人々が、愛する者の名を呼びながら見送っている。':s.ending==='ash'?'誰も泣いていない。ただ、誰も互いの名前を呼ばない。':'鏡の中にあなたはいない。けれど、あなたのための蝋燭が灯っている。');}else say('記憶鏡','選ばなかった未来が揺れている。');}
if(a.id==='altar'){if(!s.mirror){say('忘却の祭壇','鏡に残された記憶が必要だ。');return;}if(!s.altar){say('忘却の祭壇','名を失った人々の声がする。',[{label:'最後まで声を聞く',run:()=>{s.altar=true;s.mercy++;s.shards+=2;say('祭壇の声','「名を知らなくてもいい。ただ、いたことだけは忘れないで」');save();update();}},{label:'記録を持ち去る',run:()=>{s.altar=true;s.shards+=3;say('祭壇の声','声は途切れた。欠片だけが手に残る。');save();update();}}]);return;}say('祭壇','誰もいない祭壇に小さな灯火が揺れる。');}
if(a.id==='seal'){if(!s.keeper||!s.mirror||!s.altar){say('聖堂の扉','記録守、記憶鏡、祭壇。三つの証言が必要だ。');return;}if(!s.secondBoss){mode='battle';battle={hp:55,max:55,guard:false,turn:0,chapter:2};say('無名の騎士','「名を失った者には、守る資格もないのか」',[{label:'剣を抜く',run:()=>battleTurn('start')}]);return;}say('記録守リラ','鎧の裏に幼い字で「お兄ちゃんへ」と刻まれていた。妹の筆跡だった。',[{label:'妹への約束を残す',run:()=>finish2('promise')},{label:'名のない人々の声を残す',run:()=>finish2('voices')}]);}save();update();
