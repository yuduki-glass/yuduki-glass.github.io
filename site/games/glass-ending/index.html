<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#070810"><title>深淵機関 ABYSS ORGAN | 結月硝子</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060c;color:#e6dfe7;font-family:system-ui,"Yu Gothic",sans-serif;touch-action:none}body{display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a1020 0%,#040509 75%)}#shell{position:relative;width:min(100vw,1100px);height:min(100dvh,760px);display:flex;flex-direction:column;padding:5px;gap:5px}header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 8px;min-height:37px}h1{margin:0;font-family:serif;letter-spacing:.15em;font-size:clamp(14px,3vw,23px);color:#e8b4b2}header small{color:#8995a4;font-size:10px}#hud{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;background:#121421d9;border:1px solid #56404c;border-radius:7px;padding:5px 8px;font-size:clamp(10px,2.2vw,13px)}#hud b{color:#e8a89d}#viewport{position:relative;flex:1;min-height:0;border:1px solid #684954;border-radius:9px;overflow:hidden;box-shadow:0 0 35px #a5313833;background:#070a12}canvas{width:100%;height:100%;display:block;touch-action:none}#message{position:absolute;left:10px;top:9px;font-size:11px;letter-spacing:.1em;color:#e8b8a5;text-shadow:0 1px 4px #000;pointer-events:none}#overlay{position:absolute;inset:0;z-index:10;background:#050710df;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:11px;padding:20px;overflow-y:auto}#overlay h2{font:normal clamp(23px,5vw,43px) serif;letter-spacing:.18em;color:#f2b3ac;margin:0;text-shadow:0 0 25px #e24c5955}#overlay p{font-size:clamp(12px,2.6vw,15px);line-height:1.9;max-width:560px;margin:0;color:#c2c0ce}button{font:inherit;color:#f4e4e3;border:1px solid #a56b72;background:linear-gradient(#3a2533,#181923);border-radius:9px;padding:11px 16px;cursor:pointer;touch-action:manipulation}button:active{filter:brightness(1.45)}.hidden{display:none!important}#controls{height:clamp(92px,18dvh,142px);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 8px max(4px,env(safe-area-inset-bottom));background:#0d1019;border:1px solid #453843;border-radius:10px}#stick{position:relative;width:clamp(82px,23vw,118px);height:clamp(82px,23vw,118px);border:2px solid #8b6c80;border-radius:50%;background:radial-gradient(circle,#35405077,#0c131dbb);touch-action:none;flex:none}#nub{position:absolute;left:50%;top:50%;width:42%;height:42%;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#a3bdc7,#415063);border:2px solid #a8a1af;box-shadow:0 0 15px #a3b5c355;pointer-events:none}#controlRight{display:flex;align-items:center;gap:7px}#controlRight button{padding:9px 10px;min-height:55px;font-size:12px}#fire{min-width:75px;border-color:#e6a0a0;background:radial-gradient(circle at 50% 25%,#8c3948,#421c2b);font-weight:700}#bomb{border-color:#8ca7bb}#pause{border-color:#777}@media(min-width:800px){#controls{height:105px}#controlRight button{font-size:14px}}@media(max-height:570px){header{min-height:25px;padding:0 5px}#controls{height:83px}#stick{width:76px;height:76px}#controlRight button{min-height:43px;padding:5px 9px}#overlay{gap:5px;padding:8px}#overlay p{line-height:1.45}}
#hud{min-height:29px}#controls{height:clamp(79px,16dvh,126px)} </style></head><body><main id="shell"><header><h1>深淵機関 <small>ABYSS ORGAN</small></h1><small>生体侵蝕型・横スクロールSTG</small></header><div id="hud"><span>機体 <b id="hp">■■■</b></span><span>得点 <b id="score">000000</b></span><span>段階 <b id="stage">1</b></span><span>追従オーブ <b id="weapon">0 / 4</b></span><span>殲滅波 <b id="bombs">2</b></span></div><div id="viewport"><canvas id="game" width="960" height="540" aria-label="横スクロールシューティング"></canvas><div id="message">ORGANIC ZONE / 生体汚染区域</div><div id="overlay"><h2>深淵機関</h2><p>星の内部で増殖する、名もない臓器。<br>機体〈葬送鳥〉を操り、生きた要塞の心臓を破壊せよ。<br><strong>移動：左スティック / 画面ドラッグ / 矢印キー</strong><br>攻撃：自動連射（FIREで強化連射） / SPACE<br>赤いオーブを取ると分身が自動で増加（最大4個）。分身も同じ攻撃をする。青い結晶で機体を修復。</p><button id="start">侵蝕領域へ出撃</button></div></div><div id="controls"><div id="stick" aria-label="移動スティック"><div id="nub"></div></div><div id="controlRight"><button id="pause">一時停止</button><button id="bomb">殲滅波</button><button id="fire">FIRE<br>連射</button></div></div></main>
<script>
(()=>{
'use strict';
const c=document.getElementById('game'),g=c.getContext('2d'),$=id=>document.getElementById(id),W=960,H=540,TAU=Math.PI*2;
let mode='title',frame=0,score=0,stage=1,kills=0,scroll=0,boss=null,shake=0,flash=0,fireHeld=false,joy={x:0,y:0},keys={},enemies=[],shots=[],enemyShots=[],particles=[],pickups=[],stars=[],player={x:125,y:270,hp:3,max:3,level:1,bombs:2,inv:0},nextBoss=0,optionTrails=[],optionCount=0,speedLevel=0,missile=false,weaponMode='normal',shield=0,missileTick=0,upgradeNotice=0;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
for(let i=0;i<100;i++)stars.push({x:rand(0,W),y:rand(0,H),r:rand(.5,2.4),v:rand(.25,2)});
function hud(){$('hp').textContent='■'.repeat(Math.max(0,player.hp))+'□'.repeat(Math.max(0,player.max-player.hp));$('score').textContent=String(score).padStart(6,'0');$('stage').textContent=stage;$('weapon').textContent=optionCount+' / 4';$('bombs').textContent=player.bombs;}
function reset(){frame=0;score=0;stage=1;kills=0;scroll=0;boss=null;shake=0;flash=0;nextBoss=0;upgradeNotice=0;optionTrails=[];optionCount=0;speedLevel=0;missile=false;weaponMode='normal';shield=0;missileTick=0;enemies=[];shots=[];enemyShots=[];particles=[];pickups=[];player={x:125,y:270,hp:3,max:3,level:1,bombs:2,inv:90};joy={x:0,y:0};mode='play';$('overlay').classList.add('hidden');$('message').textContent='第1侵蝕層 / 肉壁の回廊';hud();}
function burst(x,y,col,n=14,power=5){for(let i=0;i<n;i++){let a=rand(0,TAU),v=rand(.5,power);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(15,43),max:43,col,r:rand(1.5,5)});}}
function fireAt(x,y){
if(weaponMode==='laser'){shots.push({x:x+30,y,vx:16,vy:0,dmg:3,r:10,laser:true,pierce:3});}
else{shots.push({x:x+30,y,vx:12,vy:0,dmg:1,r:4});if(weaponMode==='double')shots.push({x:x+24,y:y-10,vx:9,vy:-7,dmg:1,r:4});}
if(missile&&frame%24===0)shots.push({x:x+10,y:y+16,vx:7,vy:3,dmg:3,r:7,missile:true});}
function shoot(){fireAt(player.x,player.y);for(let i=0;i<optionCount;i++){const o=optionPosition(i);fireAt(o.x,o.y);}}
function optionPosition(i){const past=optionTrails[Math.min(optionTrails.length-1,(i+1)*12)];return past||{x:player.x-(i+1)*40,y:player.y};}
function spawn(){const type=Math.random(),y=rand(72,468),hp=stage+1;enemies.push({x:1010,y,base:y,phase:rand(0,TAU),type:type<.28?'eye':type<.55?'jaw':type<.83?'spore':'eel',hp:type<.55?hp:hp+2,max:type<.55?hp:hp+2,r:type<.55?23:29,t:0,shot:rand(50,110)});}
function bossSpawn(){boss={x:1120,y:270,hp:95+stage*35,max:95+stage*35,t:0,shot:0};$('message').textContent='警告：生体中枢 接近';shake=9;flash=14;}
function hostileShot(x,y,ang,speed=3.6){enemyShots.push({x,y,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,r:6});}
function bomb(){if(mode!=='play'||player.bombs<=0)return;player.bombs--;shake=16;flash=20;enemyShots=[];enemies.forEach(e=>{e.hp-=15;burst(e.x,e.y,'#d69ba4',8)});if(boss)boss.hp-=25;burst(player.x,player.y,'#a9e4f3',45,12);hud();}
function damage(){if(player.inv>0||mode!=='play')return;if(shield>0){shield--;player.inv=45;shake=5;burst(player.x,player.y,'#8de3f5',15);hud();return;}player.hp--;player.inv=100;speedLevel=0;missile=false;weaponMode='normal';optionCount=0;optionTrails=[];shake=13;flash=11;burst(player.x,player.y,'#a4dbe8',27,7);hud();if(player.hp<=0){mode='over';$('overlay').classList.remove('hidden');$('overlay').innerHTML='<h2>機体、沈黙</h2><p>侵蝕は止まらない。<br>最終得点：'+score+'　到達段階：'+stage+'</p><button id="retry">再出撃</button>';$('retry').onclick=reset;}}
function pickup(x,y){let r=Math.random();if(r<.76)pickups.push({x,y,type:r<.66?'orb':'heal',t:0});}
function update(){
if(mode!=='play')return;frame++;scroll+=2+stage*.24;if(player.inv>0)player.inv--;if(shake>0)shake*=.84;if(flash>0)flash--;
let dx=joy.x+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=joy.y+(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len;}
player.x=clamp(player.x+dx*(4.1+speedLevel*1.25),35,W-75);player.y=clamp(player.y+dy*(4.1+speedLevel*1.25),56,H-56);optionTrails.unshift({x:player.x,y:player.y});if(optionTrails.length>70)optionTrails.pop();
if(frame%(fireHeld||keys[' ']?5:10)===0)shoot();
if(!boss&&frame%Math.max(28,80-stage*7)===0)spawn();
if(!boss&&frame>=nextBoss+1450)bossSpawn();
enemies.forEach(e=>{e.t++;e.x-=2.5+stage*.32+(e.type==='eel'?2:0);e.y=e.base+Math.sin(e.t*.045+e.phase)*(e.type==='eel'?50:23);e.shot--;if(e.shot<=0&&e.x<W-20){hostileShot(e.x-12,e.y,Math.atan2(player.y-e.y,player.x-e.x),3+stage*.28);e.shot=rand(75,145);}if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+19)damage();});
if(boss){boss.t++;boss.x+=(W-155-boss.x)*.018;boss.y=270+Math.sin(boss.t*.018)*105;boss.shot++;if(boss.shot%35===0){let a=Math.atan2(player.y-boss.y,player.x-boss.x);for(let i=-2;i<=2;i++)hostileShot(boss.x-85,boss.y,a+i*.22,3.5+stage*.25);}if(Math.hypot(boss.x-80-player.x,boss.y-player.y)<82)damage();}
shots.forEach(s=>{s.x+=s.vx;s.y+=s.vy;let targets=boss?[...enemies,boss]:enemies;for(const e of targets){if(Math.hypot(s.x-e.x,s.y-e.y)<(e===boss?83:e.r)+s.r){e.hp-=s.dmg;if(s.laser&&s.pierce>0){s.pierce--;s.x+=22;}else s.x=W+999;burst(e.x,e.y,'#e8a6b0',3,2);break;}}});
enemyShots.forEach(s=>{s.x+=s.vx;s.y+=s.vy;if(Math.hypot(s.x-player.x,s.y-player.y)<s.r+14){s.x=-999;damage();}});
for(const e of enemies){if(e.hp<=0){score+=110*stage;kills++;burst(e.x,e.y,'#c74c6e',22,7);pickup(e.x,e.y);e.x=-999;}}
if(boss&&boss.hp<=0){score+=5000*stage;burst(boss.x,boss.y,'#e97091',100,14);boss=null;stage++;nextBoss=frame;player.hp=Math.min(player.max,player.hp+1);player.bombs++;player.level=Math.min(6,player.level+1);$('message').textContent='中枢破壊 / 第'+stage+'侵蝕層へ';shake=20;flash=22;hud();}
pickups.forEach(p=>{p.x-=2;p.t++;if(Math.hypot(p.x-player.x,p.y-player.y)<28){if(p.type==='orb'){if(optionCount<4){optionCount++;optionTrails=[];upgradeNotice=100;$('message').textContent='追従オーブ '+optionCount+' / 4　攻撃力増強！';burst(player.x,player.y,'#f8b5d4',28,9);flash=7;}else{score+=600;player.bombs=Math.min(9,player.bombs+1);$('message').textContent='オーブ最大！ 殲滅波 +1';}}else{player.hp=Math.min(player.max,player.hp+1);$('message').textContent='機体修復';}score+=250;burst(p.x,p.y,p.type==='orb'?'#fa799f':'#83d6ed',14);p.x=-999;hud();}});
particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;p.life--;});
enemies=enemies.filter(e=>e.x>-65);shots=shots.filter(s=>s.x<W+40&&s.y>-30&&s.y<H+30);enemyShots=enemyShots.filter(s=>s.x>-40&&s.x<W+40&&s.y>-40&&s.y<H+40);particles=particles.filter(p=>p.life>0);pickups=pickups.filter(p=>p.x>-30);
if(upgradeNotice>0)upgradeNotice--;if(frame%60===0)hud();
}
function ellipse(x,y,rx,ry,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fill();}
function line(points,col,w=2){g.strokeStyle=col;g.lineWidth=w;g.beginPath();points.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();}
function backdrop(){
const grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#090a18');grad.addColorStop(.5,'#1c101f');grad.addColorStop(1,'#080b14');g.fillStyle=grad;g.fillRect(0,0,W,H);
for(const s of stars){s.x-=s.v*.35;if(s.x<0)s.x=W;ellipse(s.x,s.y,s.r,s.r,'#9a91ac77');}
for(let layer=0;layer<3;layer++){let off=(scroll*(.2+layer*.36))%200;for(let i=-1;i<7;i++){let x=i*200-off,y=layer===0?30:layer===1?H-30:0;g.fillStyle=['#151625','#221624','#321922'][layer];g.beginPath();g.moveTo(x,0);g.bezierCurveTo(x+55,55+layer*30,x+75,110+layer*15,x+105,140+layer*12);g.bezierCurveTo(x+140,180,x+175,75,x+200,0);g.closePath();g.fill();g.beginPath();g.moveTo(x,H);g.bezierCurveTo(x+40,H-80,x+90,H-140,x+120,H-120);g.bezierCurveTo(x+170,H-100,x+180,H-45,x+200,H);g.closePath();g.fill();}}
for(let i=0;i<15;i++){let x=((i*137-scroll*.7)%(W+180)+(W+180))%(W+180)-80,y=i%2?H-25:25;ellipse(x,y,rand(4,7),12,'#6d28344d');line([[x,y],[x-8,y+(i%2?-28:28)],[x-16,y+(i%2?-41:41)]],'#74364566',3);}
for(let i=0;i<9;i++){let x=((i*179-scroll*1.2)%(W+160)+(W+160))%(W+160)-60,y=i%2?H-12:12;ellipse(x,y,12,18,'#762c43');ellipse(x,y,5,9,'#da6a7a');}
}
function ship(){
if(player.inv>0&&frame%6<3)return;
g.save();g.translate(player.x,player.y);let tilt=clamp(joy.y,-1,1);g.rotate(tilt*.12);
g.fillStyle='#a1c4d2';g.beginPath();g.moveTo(34,0);g.lineTo(-11,-13);g.lineTo(-25,-9);g.lineTo(-20,0);g.lineTo(-25,9);g.lineTo(-11,13);g.closePath();g.fill();
g.fillStyle='#344c62';g.beginPath();g.moveTo(11,0);g.lineTo(-19,-26);g.lineTo(-9,-4);g.lineTo(-19,26);g.closePath();g.fill();
g.fillStyle='#b6b8bd';g.beginPath();g.moveTo(-4,-6);g.lineTo(19,0);g.lineTo(-4,6);g.closePath();g.fill();
ellipse(4,0,10,5,'#72d8ed');ellipse(-23,0,8+Math.sin(frame*.7)*4,5,'#6bdeff');ellipse(-31,0,12+Math.random()*8,3,'#c7e9ff88');
if(player.level>=3){ellipse(-6,-24,4,4,'#ed7c9e');ellipse(-6,24,4,4,'#ed7c9e');}
g.restore();
}
function monster(e){g.save();g.translate(e.x,e.y);const pulse=1+Math.sin(frame*.09+e.phase)*.1;g.scale(pulse,pulse);
if(e.type==='eye'){ellipse(0,0,26,20,'#5a263f');ellipse(-3,0,17,14,'#d48c9b');ellipse(-5,0,9,10,'#241625');ellipse(-7,0,4,6,'#f8d1c8');for(let i=0;i<7;i++){let a=i*TAU/7;line([[15*Math.cos(a),15*Math.sin(a)],[35*Math.cos(a),35*Math.sin(a)]],'#8e3657',3);}}
else if(e.type==='jaw'){ellipse(0,0,27,23,'#622d41');ellipse(-8,0,19,16,'#150e1a');for(let i=-3;i<=3;i++){line([[-16,i*4],[-2,i*4+2]],'#d7b5ac',3);}ellipse(19,-8,8,7,'#b94961');}
else if(e.type==='spore'){for(let i=0;i<6;i++){let a=i*TAU/6+frame*.012;ellipse(Math.cos(a)*18,Math.sin(a)*18,11,8,'#78314b');}ellipse(0,0,20,20,'#b05c6c');ellipse(-4,0,8,8,'#241622');}
else{ellipse(0,0,34,15,'#703449');for(let i=0;i<5;i++)ellipse(-23+i*12,Math.sin(frame*.13+i)*9,9,11,'#9b4b62');ellipse(-15,0,9,8,'#f1a0a7');ellipse(-17,0,4,5,'#251725');}
g.restore();}
function drawBoss(){if(!boss)return;const b=boss;g.save();g.translate(b.x,b.y);let p=Math.sin(frame*.05);
for(let i=0;i<9;i++){let a=i*TAU/9+frame*.003;let x=Math.cos(a)*93,y=Math.sin(a)*103;line([[0,0],[x,y],[x+Math.cos(a)*30,y+Math.sin(a)*35]],'#63253e',10);ellipse(x,y,18,22,'#9c3b56');}
ellipse(0,0,101+p*5,117+p*4,'#51253b');ellipse(-15,0,78,94,'#9a425a');ellipse(-25,0,60,76,'#ce6a78');ellipse(-35,0,40,50,'#351a2a');ellipse(-44,0,25,33,'#f7a3a0');ellipse(-48,0,15,22,'#1a1221');ellipse(-55,-5,6,9,'#fff0dc');
for(let i=-3;i<=3;i++){line([[-70,i*17],[-91,i*18+6]],'#e4a7a4',4);}
g.restore();
g.fillStyle='#250f19';g.fillRect(270,14,430,12);g.fillStyle='#d55e79';g.fillRect(272,16,426*Math.max(0,b.hp/b.max),8);g.strokeStyle='#e8b0a7';g.strokeRect(270,14,430,12);g.fillStyle='#f3c1b8';g.font='13px system-ui';g.textAlign='center';g.fillText('ORGAN CORE / 生体中枢',W/2,44);g.textAlign='left';}
function render(){
g.save();if(shake>.4)g.translate(rand(-shake,shake),rand(-shake,shake));backdrop();
for(const p of pickups){g.save();g.translate(p.x,p.y);g.rotate(frame*.035);g.fillStyle=p.type==='orb'?'#e96289':'#71d4ef';g.beginPath();g.moveTo(0,-14);g.lineTo(12,0);g.lineTo(0,14);g.lineTo(-12,0);g.closePath();g.fill();g.restore();}
enemies.forEach(monster);drawBoss();for(let i=optionCount-1;i>=0;i--){const o=optionPosition(i);ellipse(o.x,o.y,11,11,'#7e5a72');ellipse(o.x,o.y,7,7,'#f1b0b5');ellipse(o.x+2,o.y,3,3,'#f7e9cf');}
for(const s of shots){ellipse(s.x,s.y,s.laser?32:s.r*2,s.laser?6:s.r,s.laser?'#f9a9bf':s.missile?'#ffbc75':'#a9eaf9');ellipse(s.x-12,s.y,s.r*2,s.r*.5,'#7de0ff66');}
for(const s of enemyShots){ellipse(s.x,s.y,s.r,s.r,'#fa7395');ellipse(s.x,s.y,2,2,'#ffe7db');}
ship();if(upgradeNotice>0){g.save();g.globalAlpha=Math.min(1,upgradeNotice/25);g.font='bold 24px system-ui';g.textAlign='center';g.fillStyle='#ffd0df';g.shadowColor='#f3599a';g.shadowBlur=20;g.fillText('ORBITAL LINK  '+optionCount+' / 4',W/2,92);g.restore();}if(shield>0){g.strokeStyle='#8cdef5';g.lineWidth=3;g.globalAlpha=.55+Math.sin(frame*.15)*.15;g.beginPath();g.ellipse(player.x,player.y,40,32,0,0,TAU);g.stroke();g.globalAlpha=1;}for(const p of particles){g.globalAlpha=clamp(p.life/p.max,0,1);ellipse(p.x,p.y,p.r,p.r,p.col);}g.globalAlpha=1;if(flash>0){g.fillStyle='rgba(255,189,210,'+(flash/70)+')';g.fillRect(0,0,W,H);}g.restore();

}
function loop(){update();render();requestAnimationFrame(loop);}
function togglePause(){if(mode==='play'){mode='pause';$('pause').textContent='再開';}else if(mode==='pause'){mode='play';$('pause').textContent='一時停止';}}
$('start').onclick=reset;$('pause').onclick=togglePause;$('bomb').onclick=bomb;
const fire=$('fire');fire.addEventListener('pointerdown',e=>{fireHeld=true;fire.setPointerCapture(e.pointerId);});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>fire.addEventListener(ev,()=>fireHeld=false));
const stick=$('stick'),nub=$('nub');let stickId=null;
function moveStick(e){const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=r.width*.34,l=Math.hypot(dx,dy),k=l>max?max/l:1;joy.x=dx*k/max;joy.y=dy*k/max;nub.style.transform='translate(calc(-50% + '+dx*k+'px),calc(-50% + '+dy*k+'px))';}
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e);});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e);});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>stick.addEventListener(ev,e=>{if(e.pointerId===stickId){stickId=null;joy={x:0,y:0};nub.style.transform='translate(-50%,-50%)';}}));
let dragId=null,origin=null;c.addEventListener('pointerdown',e=>{if(mode!=='play')return;dragId=e.pointerId;origin={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId);});c.addEventListener('pointermove',e=>{if(e.pointerId!==dragId||!origin)return;const r=c.getBoundingClientRect(),dx=(e.clientX-origin.x)/r.width*W,dy=(e.clientY-origin.y)/r.height*H,l=Math.hypot(dx,dy);joy.x=l>12?clamp(dx/65,-1,1):0;joy.y=l>12?clamp(dy/65,-1,1):0;});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>c.addEventListener(ev,e=>{if(e.pointerId===dragId){dragId=null;origin=null;joy={x:0,y:0};}}));
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key==='b'||e.key==='B')bomb();if(e.key==='Escape'||e.key==='p')togglePause();});document.addEventListener('keyup',e=>keys[e.key]=false);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')togglePause();});
hud();loop();
