<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MERGE 100 | 結月硝子</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:radial-gradient(ellipse at 45% 10%,#263c59,#090f1d 75%);color:#eef6ff;font-family:system-ui,"Noto Sans JP",sans-serif}button{font:inherit;color:inherit;cursor:pointer}#app{height:100dvh;max-width:1150px;margin:auto;padding:clamp(8px,1.6vh,18px);display:flex;flex-direction:column;gap:clamp(6px,1vh,12px)}header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex:none}h1{font-size:clamp(18px,3vw,29px);margin:0;letter-spacing:.04em}h1 small{font-size:.55em;color:#93b4ce;font-weight:400}.back{color:#a5d4ea;text-decoration:none;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;flex:none}.stat,.panel{border:1px solid #47617a99;background:#17263bdc;border-radius:13px}.stat{padding:9px 11px;min-width:0}.stat label{display:block;color:#9cb3ca;font-size:clamp(9px,1.3vw,12px)}.stat b{font-size:clamp(13px,2vw,22px);overflow:hidden;text-overflow:ellipsis;display:block;white-space:nowrap}.progress{height:7px;border-radius:20px;background:#34465e;overflow:hidden;flex:none}.progress div{height:100%;background:linear-gradient(90deg,#49b8c6,#e7d99c);width:0}.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(215px,300px);gap:10px;flex:1;min-height:0}.boardbox{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}.board{width:min(100%,calc((100dvh - 200px)*1.02),610px);aspect-ratio:1;max-height:100%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:clamp(3px,.7vw,8px);padding:clamp(5px,.8vw,9px);border:1px solid #59718c;background:#0a1728c9;border-radius:16px;touch-action:none;position:relative}.cell{border:1px solid #304b65;background:linear-gradient(145deg,#1b3047,#112035);border-radius:12px;position:relative;display:grid;place-items:center;min-width:0;min-height:0;touch-action:none}.cell.target{border-color:#79f7d8;background:#224d54}.cell.invalid{border-color:#d88b8b}.tile{width:90%;height:90%;display:flex;align-items:center;justify-content:center;flex-direction:column;filter:drop-shadow(0 4px 8px #0008);touch-action:none;user-select:none;cursor:grab;position:relative}.tile svg{width:80%;height:78%;overflow:visible}.tile span{font-size:clamp(9px,1.5vw,15px);font-weight:800;color:#effbff;text-shadow:0 1px 4px #000;position:absolute;bottom:0;background:#0c1a2b99;border-radius:8px;padding:0 5px}.tile.dragging{opacity:.22}.ghost{position:fixed;z-index:100;pointer-events:none;width:80px;height:80px;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 12px #000a)}.ghost .tile{width:100%;height:100%}.burst{position:absolute;inset:0;pointer-events:none;border-radius:50%;animation:burst .55s ease-out forwards;border:3px solid #b3f7f4;box-shadow:0 0 25px #75faff}@keyframes burst{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}.controls{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.btn{background:#31587a;border:1px solid #658ca9;padding:9px 13px;border-radius:10px;font-size:clamp(11px,1.4vw,14px)}.btn.primary{background:#16818b;border-color:#59cad1}.btn:disabled{opacity:.4}.side{display:flex;flex-direction:column;gap:9px;min-height:0}.panel{padding:12px;min-height:0}.panel h2{font-size:14px;margin:0 0 7px}.muted{color:#a8bfd2;font-size:12px}.big{font-size:clamp(16px,2vw,23px);font-weight:800}.visual{height:clamp(75px,16vh,155px);display:flex;align-items:end;justify-content:center;gap:5px;overflow:hidden;padding:8px;background:linear-gradient(#162c49,#101e31);border-radius:9px;margin:7px 0}.tower{width:17%;min-width:13px;background:linear-gradient(90deg,#385d7b,#75b6cb,#294762);border:1px solid #8bd5df;border-radius:4px 4px 0 0;box-shadow:0 0 14px #5ed6e933}.tower:nth-child(2n){background:linear-gradient(90deg,#665984,#c5a8d8,#544469)}.side .btn{width:100%;text-align:left;margin:3px 0}.log{font-size:11px;color:#b5c9d9;overflow:auto;flex:1;min-height:38px}.log div{padding:3px 0;border-bottom:1px solid #ffffff15}.hint{font-size:11px;color:#9fb8cd;text-align:center;flex:none}.toast{position:fixed;left:50%;top:19%;transform:translateX(-50%);background:#284e64;border:1px solid #8cdfe4;padding:10px 18px;border-radius:14px;z-index:110;pointer-events:none;animation:fade 1.5s forwards}@keyframes fade{0%,65%{opacity:1}100%{opacity:0}}@media(max-width:690px){#app{gap:5px;padding:7px}.stats{gap:4px}.stat{padding:6px}.play{display:flex;flex-direction:column;gap:5px}.boardbox{flex:1;min-height:0;justify-content:center}.board{width:min(100%,calc(100dvh - 355px),490px);max-height:100%;min-width:0}.side{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:5px}.panel{padding:7px}.panel h2{font-size:11px;margin-bottom:3px}.visual{height:38px;margin:3px 0}.side .btn{padding:6px;font-size:10px;margin:1px 0}.big{font-size:13px}.muted{font-size:10px}.logpanel{display:none}.hint{font-size:9px}.controls .btn{padding:7px;font-size:11px}}@media(max-height:650px) and (min-width:691px){.board{width:min(100%,calc(100dvh - 150px),520px)}.visual{height:65px}.logpanel{display:none}}
</style></head><body><div id="app">
<header><h1>MERGE 100 <small>無意味な進歩</small></h1><a class="back" href="/">結月硝子へ戻る ↗</a></header>
<div class="stats"><div class="stat"><label>最高レベル</label><b id="highest">LV.1</b></div><div class="stat"><label>累計生成資源</label><b id="total">0</b></div><div class="stat"><label>生産能力 / 秒</label><b id="rate">1</b></div><div class="stat"><label>本当の達成率</label><b id="percent">0%</b></div></div>
<div class="progress"><div id="fill"></div></div>
<div class="play"><div class="boardbox"><div id="board" class="board" aria-label="マージ盤面"></div><div class="controls"><button class="btn primary" id="spawn">◆ 結晶を生成</button><button class="btn" id="collect">◆ 生産資源から生成</button><button class="btn" id="reset">リセット</button></div><div class="hint">同じレベルの結晶をドラッグして重ねると合体。空きマスへ移動もできる。</div></div>
<aside class="side"><section class="panel"><h2>文明の発展</h2><div id="stage" class="big">手作業の時代</div><div id="city" class="visual"></div><div class="muted" id="remaining">目標までの距離を計算中</div></section><section class="panel"><h2>生産設備</h2><div class="muted" id="bank">資源 0</div><button class="btn" id="buy">工場を建設</button><button class="btn" id="upgrade">生産力を2倍</button><div class="muted" id="time"></div></section><section class="panel logpanel"><h2>文明発展ログ</h2><div class="log" id="log"></div></section></aside></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),KEY='merge100-board-v2',GOAL=1n<<99n;
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch{}
let board=Array.isArray(saved.board)&&saved.board.length===25?saved.board:Array(25).fill(0),total=BigInt(saved.total||0),bank=BigInt(saved.bank||0),machines=Number(saved.machines||0),power=Number(saved.power||0),highest=Number(saved.highest||1),drag=null,tick=0;
const fmt=x=>x.toLocaleString('ja-JP'),short=x=>{let s=x.toString();return s.length<=12?fmt(x):s[0]+'.'+s.slice(1,4)+'e'+(s.length-1)},rate=()=>BigInt(Math.max(1,machines))*2n**BigInt(power),cost=()=>10n*3n**BigInt(machines),upcost=()=>100n*5n**BigInt(power);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({board,total:String(total),bank:String(bank),machines,power,highest}))}catch{}};
const log=m=>{let e=document.createElement('div');e.textContent=m;$('log').prepend(e);while($('log').children.length>12)$('log').lastChild.remove()};
const toast=m=>{let e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),1500)};
function crystal(n){let hue=(185+n*23)%360,shape=n%4,points=shape===0?'50,2 93,25 85,77 50,98 15,77 7,25':shape===1?'50,2 85,15 98,50 85,85 50,98 15,85 2,50 15,15':shape===2?'50,2 94,78 6,78':'50,1 76,25 99,50 76,75 50,99 24,75 1,50 24,25';return '<svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="g'+n+'" x1="0" x2="1" y1="0" y2="1"><stop stop-color="hsl('+hue+',95%,83%)"/><stop offset=".48" stop-color="hsl('+hue+',75%,52%)"/><stop offset="1" stop-color="hsl('+hue+',75%,22%)"/></linearGradient></defs><polygon points="'+points+'" fill="url(#g'+n+')" stroke="hsl('+hue+',90%,80%)" stroke-width="3"/><path d="M50 7 L50 92 M12 45 L50 25 L87 45" fill="none" stroke="#ffffff" stroke-opacity=".32" stroke-width="3"/></svg>'}
function tile(n){return '<div class="tile">'+crystal(n)+'<span>LV.'+n+'</span></div>'}
function stage(){return highest>=90?'宇宙全域':highest>=70?'銀河文明':highest>=50?'恒星間文明':highest>=40?'惑星文明':highest>=30?'工業国家':highest>=20?'自動化都市':highest>=10?'工業都市':'手作業の時代'}
function render(){let root=$('board');root.innerHTML=board.map((n,i)=>'<div class="cell" data-i="'+i+'">'+(n?tile(n):'')+'</div>').join('');$('highest').textContent='LV.'+highest;$('total').textContent=short(total);$('rate').textContent=short(rate());let scaled=total*1000000000000000000n/GOAL,pct=Number(scaled)/1e16;$('percent').textContent=pct?pct.toPrecision(4)+'%':'< 0.0000000000000001%';$('fill').style.width=Math.min(100,pct)+'%';$('stage').textContent=stage();$('bank').textContent='使用可能資源 '+short(bank);$('buy').textContent='工場建設 ('+short(cost())+')';$('upgrade').textContent='生産力×2 ('+short(upcost())+')';$('buy').disabled=bank<cost();$('upgrade').disabled=bank<upcost();$('collect').disabled=bank<1n||!board.includes(0);$('spawn').disabled=!board.includes(0);let years=(GOAL>total?GOAL-total:0n)/rate()/31556952n;$('time').textContent='残り約 '+short(years)+' 年';$('remaining').textContent='目標 LV.100 / 残り '+short(GOAL>total?GOAL-total:0n)+' 個';let city=$('city');city.innerHTML='';let count=Math.min(12,2+Math.floor(highest/5));for(let i=0;i<count;i++){let e=document.createElement('div');e.className='tower';e.style.height=(25+(i*31+highest*7)%70)+'%';city.append(e)}}
function put(n,paid){let i=board.indexOf(0);if(i<0){toast('盤面がいっぱい。結晶を合成してね');return false}board[i]=n;if(!paid){total+=1n;bank+=1n}render();save();return true}
function merge(from,to){if(from===to||board[from]===0)return;let a=board[from],b=board[to];if(b===0){board[to]=a;board[from]=0}else if(a===b&&a<100){board[from]=0;board[to]=a+1;if(a+1>highest){highest=a+1;log('LV.'+highest+' 到達。まだ先は長い。');if(highest%10===0)toast('文明が発展！ '+stage())}requestAnimationFrame(()=>{let c=$('board').children[to];if(c){let e=document.createElement('div');e.className='burst';c.append(e);setTimeout(()=>e.remove(),600)}})}else{toast('同じレベル同士で合成できる')}render();save()}
const root=$('board');root.addEventListener('pointerdown',e=>{let cell=e.target.closest('.cell');if(!cell)return;let from=Number(cell.dataset.i);if(!board[from])return;e.preventDefault();drag={from,id:e.pointerId};root.setPointerCapture(e.pointerId);let g=document.createElement('div');g.className='ghost';g.innerHTML=tile(board[from]);document.body.append(g);drag.ghost=g;moveGhost(e);cell.querySelector('.tile')?.classList.add('dragging')});
function moveGhost(e){if(!drag)return;drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';document.querySelectorAll('.cell.target,.cell.invalid').forEach(c=>c.classList.remove('target','invalid'));let dest=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');if(dest){let i=Number(dest.dataset.i);if(i!==drag.from)dest.classList.add(board[i]===0||board[i]===board[drag.from]?'target':'invalid')}}
root.addEventListener('pointermove',moveGhost);function end(e){if(!drag)return;let from=drag.from;drag.ghost.remove();drag=null;let dest=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');if(dest&&root.contains(dest))merge(from,Number(dest.dataset.i));else render()}root.addEventListener('pointerup',end);root.addEventListener('pointercancel',end);
$('spawn').onclick=()=>put(1,false);$('collect').onclick=()=>{if(bank>=1n&&board.includes(0)){bank--;put(1,true)}};$('buy').onclick=()=>{if(bank<cost())return;bank-=cost();machines++;log('工場を建設。毎秒生産 '+short(rate()));render();save()};$('upgrade').onclick=()=>{if(bank<upcost())return;bank-=upcost();power++;log('生産能力が2倍に。');render();save()};$('reset').onclick=()=>{if(confirm('進行状況をすべて初期化する？')){localStorage.removeItem(KEY);location.reload()}};
render();log('同じ結晶を重ねて合成しよう');setInterval(()=>{let r=rate();bank+=r;total+=r;if(++tick%5===0)save();render()},1000);window.addEventListener('pagehide',save);
})();
</script></body></html>
