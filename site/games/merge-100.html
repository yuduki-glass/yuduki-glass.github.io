</style></head><body><div id="app">

(()=>{'use strict';

function crystal(n){
const palette=[
['#d3b8a0','#87786e','#4a4d57'],['#b7c5cb','#68869b','#354d6c'],

}else{

}
let ring=n%7===0||n%11===0,ringBack=ring?'<ellipse cx="50" cy="51" rx="46" ry="12" transform="rotate(-19 50 51)" fill="none" stroke="'+p[0]+'" stroke-width="6" opacity=".4"/>':'',ringFront=ring?'<path d="M9 61 Q49 82 91 36" stroke="'+p[0]+'" stroke-width="4" fill="none" opacity=".65"/>':'';
return '<svg viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="'+id+'" cx="32%" cy="27%" r="78%"><stop offset="0" stop-color="'+p[0]+'"/><stop offset=".53" stop-color="'+p[1]+'"/><stop offset="1" stop-color="'+p[2]+'"/></radialGradient><clipPath id="'+id+'clip"><circle cx="50" cy="50" r="'+r+'"/></clipPath></defs>'+ringBack+'<circle cx="50" cy="50" r="'+r+'" fill="url(#'+id+')"/><g clip-path="url(#'+id+'clip)">'+body+'</g><circle cx="50" cy="50" r="'+r+'" fill="none" stroke="'+p[0]+'" stroke-width="1.2" opacity=".5"/>'+ringFront+'</svg>'
}
function tile(n){return '<div class="tile'+(n>=100?' luminous luminous-'+Math.min(4,Math.floor((n-100)/25)+1):'')+'">'+crystal(n)+'<span>LV.'+n+'</span></div>'}
function stage(){return highest>=90?'宇宙全域':highest>=70?'銀河文明':highest>=50?'恒星間文明':highest>=40?'惑星文明':highest>=30?'工業国家':highest>=20?'自動化都市':highest>=10?'工業都市':'手作業の時代'}
function render(){let root=$('board');root.innerHTML=board.map((n,i)=>'<div class="cell" data-i="'+i+'">'+(n?tile(n):'')+'</div>').join('');$('storageSlots').innerHTML=storage.map((n,i)=>'<div class="cell store-cell" data-store="'+i+'">'+(n?tile(n):'')+'</div>').join('');$('highest').textContent='LV.'+highest;$('total').textContent=short(total);$('rate').textContent=short(rate());let target=1n<<BigInt(Math.max(0,highest-1)),seconds=(target+rate()-1n)/rate(),years=seconds/31556952n,days=seconds/86400n;$('percent').textContent=short(years)+' 年';$('naturalYears').textContent=years>0n?'約 '+short(years)+' 年':days>0n?'約 '+short(days)+' 日':'約 '+short(seconds)+' 秒';$('naturalDetail').textContent='必要なLV.1換算：'+short(target)+' 個 ／ 現在の生産：'+short(rate())+' 個/秒（設備増設なし）';let exponent=seconds>0n?seconds.toString().length-1:0,position=Math.min(100,Math.max(0,(exponent-5)/20*100));$('timeMarker').style.left=position+'%';$('fill').style.width=position+'%';$('stage').textContent=stage();$('stockCount').textContent=short(bank)+' 個分 / '+occupied()+'/25マス';$('stockOrbs').innerHTML=Array.from({length:Number(bank>4n?4n:bank)},()=>'<i>◆</i>').join('');$('bank').textContent='設備 '+machines+' 台 / 生産強化 '+power+' 段階';$('buy').textContent='工場を増設（累計 '+short(cost())+' 個で解放）';$('upgrade').textContent='生産力×2（累計 '+short(upcost())+' 個で解放）';$('buy').disabled=total<cost();$('upgrade').disabled=total<upcost();$('refinery').textContent='精製炉 +5/秒（'+refinery+'基・累計 '+short(refCost())+'）';$('reactor').textContent='核融合炉 ×3（'+reactor+'基・累計 '+short(reactCost())+'）';$('quantum').textContent='量子工場 ×10（'+quantum+'基・累計 '+short(quantCost())+'）';$('refinery').disabled=total<refCost();$('reactor').disabled=total<reactCost();$('quantum').disabled=total<quantCost();$('spawn').disabled=bank<1n||!board.includes(0);$('time').textContent='現在の設備を固定した場合の換算';$('remaining').textContent='LV.'+highest+' 達成 ／ 次のLV.'+(highest+1)+' に必要な資源 '+short(1n<<BigInt(highest))+' 個';$('mergeNow').disabled=!board.some((n,i)=>n>0&&board.indexOf(n,i+1)>=0);let city=$('city');city.innerHTML='';let count=Math.min(12,2+Math.floor(highest/5));for(let i=0;i<count;i++){let e=document.createElement('div');e.className='tower';e.style.height=(25+(i*31+highest*7)%70)+'%';city.append(e)}}
function autoMergeIfFull(){if(occupied()===25&&canMerge()){mergeAvailable(false);log('盤面満杯：自動マージを実行')}}
function nextCrystalLevel(){if(bank<1n)return 0;if(productionQueue.length){return productionQueue[0]}return bank.toString(2).length}
function enqueueProduction(amount){let n=Math.max(1,amount.toString(2).length);while(n>=1){let units=1n<<BigInt(n-1);while(amount>=units){if(productionQueue.length>=500)return;productionQueue.push(n);amount-=units}n--}}
function fillBoard(manual=false){if(bank<1n)return false;if(!manual&&occupied()>=AUTO_LIMIT)return false;let slot=board.indexOf(0);if(slot<0){autoMergeIfFull();return false}let level=nextCrystalLevel();if(!level)return false;let units=1n<<BigInt(level-1);board[slot]=level;bank-=units;if(productionQueue.length)productionQueue.shift();if(level>highest){highest=level;log('LV.'+highest+' の結晶を生産')}autoMergeIfFull();return true}
function mergeAvailable(show=true){let count=0;for(let level of [...new Set(board.filter(n=>n>0))].sort((a,b)=>a-b)){while(true){let first=board.indexOf(level);if(first<0)break;let second=board.indexOf(level,first+1);if(second<0)break;board[first]=level+1;board[second]=0;count++;if(level+1>highest){highest=level+1;log('LV.'+highest+' に到達。')}}}if(show){if(count){log('盤面の結晶を '+count+' 回、自動合成');toast(count+' 回マージしたよ')}else toast('合成できる結晶がない')}render();save()}
function merge(from,to){if(from===to||board[from]===0)return;let a=board[from],b=board[to];if(b===0){board[to]=a;board[from]=0}else if(a===b){board[from]=0;board[to]=a+1;if(a+1>highest){highest=a+1;log('LV.'+highest+' 到達。まだ先は長い。');if(highest%10===0)toast('文明が発展！ '+stage())}requestAnimationFrame(()=>{let c=$('board').children[to];if(c){let e=document.createElement('div');e.className='burst';c.append(e);setTimeout(()=>e.remove(),600)}})}else{toast('同じレベル同士で合成できる')}render();save()}
const root=$('board'),storeRoot=$('storageSlots');
function slotAt(x,y){let e=document.elementFromPoint(x,y);let c=e&&e.closest('.cell');if(!c)return null;if(root.contains(c))return {kind:'board',index:Number(c.dataset.i),el:c};if(storeRoot.contains(c))return {kind:'storage',index:Number(c.dataset.store),el:c};return null}
function valueOf(s){return(s.kind==='board'?board:storage)[s.index]}
function transfer(from,to){if(from.kind===to.kind&&from.index===to.index)return;let src=from.kind==='board'?board:storage,dst=to.kind==='board'?board:storage,a=src[from.index],b=dst[to.index];if(!a)return;
if(!b){dst[to.index]=a;src[from.index]=0}
else if(from.kind==='board'&&to.kind==='board'&&a===b){dst[to.index]=a+1;src[from.index]=0;if(a+1>highest){highest=a+1;log('LV.'+highest+' 到達')}}
else if(from.kind!==to.kind){dst[to.index]=a;src[from.index]=b}
else{toast('同じレベル同士で合成できる');return}
render();save()}
function startDrag(e){let s=slotAt(e.clientX,e.clientY);if(!s||!valueOf(s))return;if(e.button!==undefined&&e.button!==0)return;e.preventDefault();
if(trashMode){let arr=s.kind==='board'?board:storage,removed=arr[s.index];arr[s.index]=0;log('LV.'+removed+' を廃棄');render();save();return}
drag={from:{kind:s.kind,index:s.index},id:e.pointerId};try{e.currentTarget.setPointerCapture(e.pointerId)}catch{}
let g=document.createElement('div');g.className='ghost';g.innerHTML=tile(valueOf(s));document.body.append(g);drag.ghost=g;moveGhost(e);s.el.querySelector('.tile')?.classList.add('dragging')}
function moveGhost(e){if(!drag)return;drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';document.querySelectorAll('.cell.target,.cell.invalid').forEach(c=>c.classList.remove('target','invalid'));let dest=slotAt(e.clientX,e.clientY);if(dest){let a=valueOf(drag.from),b=valueOf(dest);let valid=!b||(drag.from.kind!==dest.kind)||(drag.from.kind==='board'&&dest.kind==='board'&&a===b);dest.el.classList.add(valid?'target':'invalid')}}
function endDrag(e){if(!drag)return;let from=drag.from;drag.ghost.remove();drag=null;let dest=slotAt(e.clientX,e.clientY);if(dest)transfer(from,dest);else render()}
for(const area of [root,storeRoot]){area.addEventListener('pointerdown',startDrag);area.addEventListener('pointermove',moveGhost);area.addEventListener('pointerup',endDrag);area.addEventListener('pointercancel',endDrag)}
$('mergeNow').onclick=()=>mergeAvailable(true);$('trashToggle').onclick=()=>{trashMode=!trashMode;$('trashToggle').setAttribute('aria-pressed',String(trashMode));$('trashToggle').textContent=trashMode?'🗑 ゴミ箱 ON（結晶をタップ）':'🗑 ゴミ箱';$('trashToggle').classList.toggle('trash-active',trashMode);toast(trashMode?'結晶をタップすると削除':'ゴミ箱を終了')};
const spawnButton=$('spawn');let holdDelay=null,holdTimer=null,holding=false;
function inject(){if(drag)return false;let ok=fillBoard(true);if(ok){render();save()}return ok}
function stopHold(){clearTimeout(holdDelay);clearInterval(holdTimer);holdDelay=null;holdTimer=null;holding=false}
spawnButton.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;e.preventDefault();stopHold();holding=true;try{spawnButton.setPointerCapture(e.pointerId)}catch{}inject();holdDelay=setTimeout(()=>{if(!holding)return;holdTimer=setInterval(()=>{if(!inject())stopHold()},65)},320)});
spawnButton.addEventListener('pointerup',stopHold);
spawnButton.addEventListener('pointercancel',stopHold);
spawnButton.addEventListener('lostpointercapture',stopHold);
spawnButton.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('blur',stopHold);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopHold()});$('buy').onclick=()=>{if(total<cost())return;machines++;log('工場を建設。毎秒生産 '+short(rate()));render();save()};$('upgrade').onclick=()=>{if(total<upcost())return;power++;log('生産能力が2倍に。');render();save()};$('refinery').onclick=()=>{if(total<refCost())return;refinery++;log('精製炉を増設：基礎生産 +5/秒');render();save()};$('reactor').onclick=()=>{if(total<reactCost())return;reactor++;log('核融合炉：生産力 ×3');render();save()};$('quantum').onclick=()=>{if(total<quantCost())return;quantum++;log('量子工場：生産力 ×10');render();save()};$('reset').onclick=()=>{if(confirm('進行状況をすべて初期化する？')){localStorage.removeItem(KEY);location.reload()}};
autoMergeIfFull();render();log('生産量を2進数で結晶化。毎秒1個を自動供給、18/25マスまで。');setInterval(()=>{let r=rate();bank+=r;total+=r;enqueueProduction(r);if(!drag){fillBoard(false);render()}else{$('stockCount').textContent=short(bank)+' 個分 / '+occupied()+'/25マス';$('total').textContent=short(total)}if(++tick%5===0)save()},1000);window.addEventListener('pagehide',save);
})();
</script></body></html>
