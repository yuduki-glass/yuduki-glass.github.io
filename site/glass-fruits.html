<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>硝子の果実 | 結月硝子</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;color:#33465b;background:radial-gradient(ellipse at 12% 15%,#b4e6e0 0,transparent 44%),radial-gradient(ellipse at 85% 22%,#e9b9df 0,transparent 44%),radial-gradient(ellipse at 48% 90%,#b6c9ee 0,transparent 58%),#e6edf0}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E")}main{max-width:570px;margin:auto;padding:20px 14px 35px;position:relative}a{color:#516b86;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;font-size:13px}.panel{border:1px solid #ffffffa8;background:#ffffff62;box-shadow:0 15px 45px #64748b22,inset 0 1px #fff8;backdrop-filter:blur(18px);border-radius:24px;padding:15px;margin-top:15px}h1{font-weight:500;letter-spacing:.16em;text-align:center;font-size:26px;margin:14px 0 5px}.sub{text-align:center;font-size:12px;letter-spacing:.1em;opacity:.7;margin:0 0 12px}.stats{display:flex;gap:10px}.stat{flex:1;text-align:center;padding:10px;background:#ffffff72;border-radius:15px}.stat small{display:block;font-size:11px;opacity:.65}.stat strong{font-size:22px;font-weight:600}canvas{display:block;width:100%;height:auto;touch-action:none;border-radius:16px;cursor:crosshair}.play{position:relative;margin-top:12px;overflow:hidden;border:1px solid #ffffffb0;border-radius:17px;background:linear-gradient(160deg,#f9fdff88,#e4eaf688)}.buttons{display:flex;gap:10px;margin-top:12px}button{flex:1;border:1px solid #fff9;background:#ffffff91;border-radius:14px;padding:12px;font-size:14px;color:#465a72;cursor:pointer}button:hover{background:#fff}.help{text-align:center;font-size:12px;line-height:1.9;opacity:.75}.overlay{position:absolute;inset:0;background:#e8f1f4ce;display:none;align-items:center;justify-content:center;flex-direction:column;gap:15px;text-align:center}.overlay.show{display:flex}.overlay b{font-size:26px;font-weight:500}.overlay button{flex:0 0 auto;min-width:140px}
</style></head><body><main><div class="top"><a href="/">← 結月硝子</a><span>GLASS FRUITS</span></div><section class="panel"><h1>硝子の果実</h1><p class="sub">重なり、響き、ひとつになる。</p><div class="stats"><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>BEST</small><strong id="best">0</strong></div><div class="stat"><small>NEXT</small><strong id="next">●</strong></div></div><div class="play"><canvas id="game" width="400" height="570" aria-label="果実を落として合成するゲーム"></canvas><div class="overlay" id="over"><b>ゲーム終了</b><span id="result"></span><button id="again">もう一度</button></div></div><div class="buttons"><button id="mode" aria-pressed="false">移動モード：OFF</button></div><div class="buttons"><button id="reset">最初から</button><button id="sound">音：ON</button></div><p class="help">通常：ドラッグして離すと落下。<br>移動モード：落下済みの果実をドラッグして合成。<br>同じ果実を重ねると、次の果実へ変化する。</p></section></main><script>
(()=>{'use strict';const c=document.getElementById('game'),g=c.getContext('2d'),W=400,H=570,ground=560;const colors=['#b8d6ed','#b9e8d4','#f4d4a6','#eebbc8','#cdb8e9','#a6d9d2','#f4bd8c','#dd9caf','#9bc4eb','#b3d19a','#81bcb0'];const names=['雫','芽','小花','桜','藤','若葉','琥珀','桃','紫陽花','洋梨','翠玉'];const radii=[15,20,25,31,38,46,55,65,76,89,103];let moveMode=false,held=null,balls=[],score=0,best=0,next=0,aim=200,lock=false,dead=false,sound=true,last=0,dropTime=0,overTicks=0;try{best=Number(localStorage.getItem('glass-fruits-best'))||0}catch(e){}const $=id=>document.getElementById(id);$('best').textContent=best;function rand(){return Math.floor(Math.random()*5)}function update(){$('score').textContent=score;$('best').textContent=best;$('next').textContent=names[next]}function reset(){held=null;balls=[];score=0;next=rand();aim=200;dead=false;lock=false;overTicks=0;$('over').classList.remove('show');update()}function tone(freq){if(!sound)return;try{const ac=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)()),o=ac.createOscillator(),v=ac.createGain();o.type='sine';o.frequency.setValueAtTime(freq,ac.currentTime);o.frequency.exponentialRampToValueAtTime(freq*1.35,ac.currentTime+.12);v.gain.setValueAtTime(.07,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.2);o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+.21)}catch(e){}}function drop(){if(dead||lock)return;let r=radii[next];balls.push({x:Math.max(r,Math.min(W-r,aim)),y:43,r,lv:next,vx:0,vy:0,id:Math.random(),age:0});next=rand();lock=true;dropTime=performance.now();tone(330);update()}function merge(a,b){const lv=a.lv+1,x=(a.x+b.x)/2,y=(a.y+b.y)/2;if(held===a||held===b)held=null;balls=balls.filter(q=>q!==a&&q!==b);balls.push({x:Math.max(radii[lv],Math.min(W-radii[lv],x)),y:Math.max(radii[lv],y),r:radii[lv],lv,vx:(a.vx+b.vx)/2,vy:-2,id:Math.random(),age:0});score+=Math.pow(2,lv)*10;if(score>best){best=score;try{localStorage.setItem('glass-fruits-best',best)}catch(e){}}tone(390+lv*75);update()}function physics(dt){let steps=3;for(let s=0;s<steps;s++){for(const b of balls){if(b===held)continue;b.age+=dt/steps;b.vy+=.19*dt/steps;b.x+=b.vx*dt/steps;b.y+=b.vy*dt/steps;b.vx*=.998;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.35}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.35}if(b.y>ground-b.r){b.y=ground-b.r;b.vy=b.vy>0?-b.vy*.16:b.vy;b.vx*=.94;if(Math.abs(b.vy)<.3)b.vy=0}}let merged=false;for(let i=0;i<balls.length&&!merged;i++)for(let j=i+1;j<balls.length;j++){let a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,min=a.r+b.r;if(d>=min)continue;if(a.lv===b.lv&&a.lv<10&&a.age>.13&&b.age>.13){merge(a,b);merged=true;break}let nx=dx/d,ny=dy/d,overlap=min-d,shift=overlap*.5;if(a===held){b.x+=nx*overlap;b.y+=ny*overlap}else if(b===held){a.x-=nx*overlap;a.y-=ny*overlap}else{a.x-=nx*shift;a.y-=ny*shift;b.x+=nx*shift;b.y+=ny*shift}let rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0&&a!==held&&b!==held){let impulse=-rel*.34;a.vx-=nx*impulse;a.vy-=ny*impulse;b.vx+=nx*impulse;b.vy+=ny*impulse}}}}function fruit(x,y,r,lv,alpha=1){g.save();g.globalAlpha=alpha;let grad=g.createRadialGradient(x-r*.35,y-r*.48,r*.07,x,y,r);grad.addColorStop(0,'#ffffff');grad.addColorStop(.28,colors[lv]);grad.addColorStop(.78,colors[lv]);grad.addColorStop(1,'#ffffffb0');g.fillStyle=grad;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();g.strokeStyle='#ffffffc9';g.lineWidth=2;g.stroke();g.beginPath();g.ellipse(x-r*.32,y-r*.37,r*.24,r*.12,-.65,0,Math.PI*2);g.fillStyle='#ffffff9e';g.fill();g.fillStyle='#344c6388';g.font=Math.max(10,Math.min(18,r*.45))+'px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(names[lv],x,y+2);g.restore()}function draw(){g.clearRect(0,0,W,H);g.strokeStyle='#7890a044';g.setLineDash([5,7]);g.beginPath();g.moveTo(0,95);g.lineTo(W,95);g.stroke();g.setLineDash([]);g.fillStyle='#64748b7a';g.font='11px sans-serif';g.fillText('LIMIT',12,89);g.fillStyle='#ffffff6b';g.fillRect(0,ground,W,H-ground);for(const b of balls)fruit(b.x,b.y,b.r,b.lv);if(!dead&&!moveMode){let r=radii[next],x=Math.max(r,Math.min(W-r,aim));g.strokeStyle='#8496a55c';g.setLineDash([4,7]);g.beginPath();g.moveTo(x,42+r);g.lineTo(x,ground);g.stroke();g.setLineDash([]);fruit(x,42,r,next,.75)}}function frame(t){let dt=Math.min((t-last)/16.67||1,2);last=t;if(!dead){physics(dt);if(lock&&t-dropTime>450)lock=false;let danger=balls.some(b=>b.y-b.r<95&&b.age>1.8&&Math.abs(b.vy)<1.5);overTicks=danger?overTicks+dt:0;if(overTicks>110){dead=true;$('result').textContent='SCORE '+score;$('over').classList.add('show')}}draw();requestAnimationFrame(frame)}function coords(e){const rect=c.getBoundingClientRect();return{x:(e.clientX-rect.left)*W/rect.width,y:(e.clientY-rect.top)*H/rect.height}}function pos(e){aim=coords(e).x}let dragging=false,activePointer=null,grabDX=0,grabDY=0;c.addEventListener('pointerdown',e=>{if(dead)return;const p=coords(e);if(moveMode){for(let i=balls.length-1;i>=0;i--){const b=balls[i];if(Math.hypot(p.x-b.x,p.y-b.y)<=b.r){held=b;grabDX=b.x-p.x;grabDY=b.y-p.y;break}}if(!held)return}else{if(lock)return;pos(e)}dragging=true;activePointer=e.pointerId;c.setPointerCapture(e.pointerId);e.preventDefault()});c.addEventListener('pointermove',e=>{if(dragging&&e.pointerId===activePointer){const p=coords(e);if(moveMode){if(held){held.x=Math.max(held.r,Math.min(W-held.r,p.x+grabDX));held.y=Math.max(held.r,Math.min(ground-held.r,p.y+grabDY));held.vx=0;held.vy=0}}else pos(e);e.preventDefault()}else if(e.pointerType==='mouse'&&!dragging&&!moveMode)pos(e)});c.addEventListener('pointerup',e=>{if(!dragging||e.pointerId!==activePointer)return;if(moveMode){if(held){held.vx=0;held.vy=0;held.age=Math.max(held.age,.2)}held=null}else{pos(e);drop()}dragging=false;activePointer=null;e.preventDefault()});c.addEventListener('pointercancel',()=>{held=null;dragging=false;activePointer=null});$('mode').onclick=()=>{moveMode=!moveMode;held=null;dragging=false;activePointer=null;$('mode').textContent='移動モード：'+(moveMode?'ON':'OFF');$('mode').setAttribute('aria-pressed',String(moveMode));};window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')aim-=20;if(e.key==='ArrowRight')aim+=20;if(e.key===' '||e.key==='ArrowDown'){e.preventDefault();if(!moveMode)drop()}aim=Math.max(15,Math.min(W-15,aim))});$('reset').onclick=reset;$('again').onclick=reset;$('sound').onclick=()=>{sound=!sound;$('sound').textContent='音：'+(sound?'ON':'OFF')};reset();requestAnimationFrame(frame)})();
</script></body></html>
